<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Agency portal: sell tickets</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="masslak-theme.css">
<link rel="stylesheet" href="ds/masslak/components/bundle.css">
<script src="ds/masslak/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A5BD3}a:hover{color:#05285F}
.ms-drawer{min-height:980px}
.quota{height:8px;border-radius:4px;background:var(--surface-container-high);overflow:hidden}
.quota>div{height:100%;border-radius:4px;background:var(--primary)}
</style>
</helmet>
<div class="ms-root" dir="ltr" style="min-height: 980px; background: var(--surface-dim); font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch;">
  <div style="flex: 1 1 272px; max-width: 272px; display: flex;">
    <x-import component-from-global-scope="Masslak.NavigationDrawer" brand="{{brand}}" sections="{{sections}}" footer="{{org}}"></x-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <header style="display: flex; align-items: center; gap: 12px; padding: 20px 32px 8px; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 220px;">
        <h1 class="headline-large" style="margin: 0;">Sell a ticket</h1>
        <p class="body-medium" style="margin: 2px 0 0; color: var(--on-surface-variant);">Al-Yasmin Travel and Tourism · Salhiyeh branch</p>
      </div>
      <x-import component-from-global-scope="Masslak.Button" variant="outlined" icon="confirmation_number">Today's bookings</x-import>
    </header>
    <div style="padding: 16px 32px 40px; display: flex; flex-direction: column; gap: 20px;">
      <section style="background: var(--surface); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--outline-variant), var(--elevation-1); padding: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end;">
        <x-import component-from-global-scope="Masslak.TextField" label="From" icon="location_on" value="Damascus"></x-import>
        <x-import component-from-global-scope="Masslak.TextField" label="To" icon="location_on" value="Latakia"></x-import>
        <x-import component-from-global-scope="Masslak.TextField" label="Date" icon="event" value="2026-11-20" dir="ltr"></x-import>
        <x-import component-from-global-scope="Masslak.TextField" label="Passengers" icon="group" value="3"></x-import>
        <x-import component-from-global-scope="Masslak.Button" icon="search" size="lg">Search all carriers</x-import>
      </section>
      <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start;">
        <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <x-import component-from-global-scope="Masslak.Chip" selected="{{yes}}" count="{{14}}">All carriers</x-import>
            <x-import component-from-global-scope="Masslak.Chip">Within my quota</x-import>
            <x-import component-from-global-scope="Masslak.Chip">Preferential fare</x-import>
            <x-import component-from-global-scope="Masslak.Chip">Evening</x-import>
          </div>
          <x-import component-from-global-scope="Masslak.DataTable" columns="{{cols}}" rows="{{rows}}"></x-import>
        </section>
        <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
          <section style="background: var(--surface); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--outline-variant), var(--elevation-1); padding: 18px; display: flex; flex-direction: column; gap: 14px;">
            <b class="title-small">Quotas this week</b>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px;"><div style="display: flex; justify-content: space-between;"><span>Al-Qadmous</span><span style="color: var(--on-surface-variant);">82 / 120 seats</span></div><div class="quota"><div style="width: 68%;"></div></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px;"><div style="display: flex; justify-content: space-between;"><span>Pullman Al-Sham</span><span style="color: var(--on-surface-variant);">47 / 60 seats</span></div><div class="quota"><div style="width: 78%;"></div></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px;"><div style="display: flex; justify-content: space-between;"><span>Al-Ahliya Transport</span><span style="color: var(--on-surface-variant);">20 / 80 seats</span></div><div class="quota"><div style="width: 25%;"></div></div></div>
          </section>
          <x-import component-from-global-scope="Masslak.Stat" icon="account_balance_wallet" label="Your commission this month (SYP)" value="4,860,000" tone="wheat" note="Statement issued on 1 December"></x-import>
        </aside>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const h = window.React.createElement, M = window.Masslak;
    return {
      yes: true,
      brand: M ? h(M.Logo, { withName: true, tagline: 'Agency portal' }) : null,
      org: h('div', null, h('b', null, 'Al-Yasmin Office'), h('div', { style: { color: 'var(--on-surface-variant)' } }, 'Approved agent · 3 sub-agents')),
      sections: [
        { items: [{ icon: 'search', label: 'Sell a ticket', active: true }, { icon: 'confirmation_number', label: 'Bookings' }, { icon: 'route', label: 'Quotas' }] },
        { title: 'Money', items: [{ icon: 'account_balance_wallet', label: 'Commissions and statements' }, { icon: 'group', label: 'Sub-agents' }] }
      ],
      cols: [{ key: 'carrier', label: 'Carrier' }, { key: 'dep', label: 'Departure' }, { key: 'arr', label: 'Arrival' }, { key: 'brand', label: 'Fare brand' }, { key: 'seats', label: 'Available', align: 'end' }, { key: 'price', label: 'Price (SYP)', align: 'end' }, { key: 'com', label: 'Your commission', align: 'end' }],
      rows: [
        { carrier: 'Al-Qadmous', dep: '07:00', arr: '11:10', brand: 'Business', seats: '12', price: '90,000', com: '4,500' },
        { carrier: 'Pullman Al-Sham', dep: '08:30', arr: '12:45', brand: 'VIP', seats: '6', price: '80,000', com: '4,000' },
        { carrier: 'Al-Ahliya Transport', dep: '09:15', arr: '13:40', brand: 'Standard', seats: '27', price: '50,000', com: '2,000' },
        { carrier: 'Al-Qadmous', dep: '13:00', arr: '17:10', brand: 'Standard', seats: '19', price: '52,000', com: '2,600' },
        { carrier: 'Zenobia', dep: '16:30', arr: '20:50', brand: 'VIP', seats: '3', price: '78,000', com: '3,900' }
      ]
    };
  }
}
</script>
</body>
</html>
