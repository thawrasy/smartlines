<!doctype html>
<html>
<head><meta charset="utf-8"><title>Banner preview</title>
<style>body{margin:0;background:var(--surface-dim)} #root{padding:20px}</style></head>
<body>
<div id="root" class="ms-root" dir="rtl"></div>
<script>
  var M = window.Masslak, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'ms-stack',style:{gap:12}},
  h(M.Banner,{tone:'warning',title:'رصيدك لا يغطي المقطع التالي',action:h(M.Button,{variant:'text',size:'sm'},'اشحن')},'المحطة القادمة: باب توما. يمكنك المتابعة وسيُسجّل المبلغ كأجرة مستحقة دون فوائد.'),
  h(M.Banner,{tone:'info'},'أنت غير متصل. التذاكر والمسح ما زالت تعمل.'),
  h(M.Banner,{tone:'success',title:'تم تأكيد الحجز'}),
  h(M.Banner,{tone:'error',title:'رخصة المركبة منتهية'},'جدّد الرخصة قبل نشر الرحلة.')));
</script>
</body>
</html>
