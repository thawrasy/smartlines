<!doctype html>
<html>
<head><meta charset="utf-8"><title>Logo preview</title>
<style>body{margin:0;background:var(--surface-dim)} #root{padding:20px}</style></head>
<body>
<div id="root" class="ms-root" dir="ltr"></div>
<script>
  var M = window.Masslak, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'ms-row',style:{gap:32}},
  h(M.Logo,{withName:true,size:40,tagline:'The smart transport and booking platform'}),
  h(M.Logo,{withName:true,size:40,lang:'en',tone:'outline'}),
  h(M.Mark,{size:64}), h(M.Mark,{size:40,tone:'symbol'}),
  h('span',{style:{background:'var(--brand-navy)',padding:12,borderRadius:16,display:'inline-flex'}},h(M.Logo,{withName:true,size:32,tone:'white'}))));
</script>
</body>
</html>
