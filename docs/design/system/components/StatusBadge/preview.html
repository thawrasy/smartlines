<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusBadge preview</title>
<style>body{margin:0;background:var(--surface-dim)} #root{padding:20px}</style></head>
<body>
<div id="root" class="ms-root" dir="ltr"></div>
<script>
  var M = window.Masslak, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'ms-row',style:{gap:8}},
  h(M.StatusBadge,{status:'CONFIRMED'},'Confirmed'), h(M.StatusBadge,{status:'PENDING_PAYMENT'},'Awaiting payment'),
  h(M.StatusBadge,{status:'DEPARTED'},'Departed'), h(M.StatusBadge,{status:'CANCELLED'},'Cancelled'),
  h(M.StatusBadge,{status:'REVIEW'},'Review'), h(M.StatusBadge,{status:'DRAFT'},'Draft')));
</script>
</body>
</html>
