<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusBadge preview</title>
<style>body{margin:0;background:var(--surface-dim)} #root{padding:20px}</style></head>
<body>
<div id="root" class="ms-root" dir="rtl"></div>
<script>
  var M = window.Masslak, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'ms-row',style:{gap:8}},
  h(M.StatusBadge,{status:'CONFIRMED'},'مؤكد'), h(M.StatusBadge,{status:'PENDING_PAYMENT'},'بانتظار الدفع'),
  h(M.StatusBadge,{status:'DEPARTED'},'انطلقت'), h(M.StatusBadge,{status:'CANCELLED'},'ملغى'),
  h(M.StatusBadge,{status:'REVIEW'},'مراجعة'), h(M.StatusBadge,{status:'DRAFT'},'مسودة')));
</script>
</body>
</html>
