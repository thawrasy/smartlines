<!-- @dsCard group="Surfaces" height=210 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card preview</title>
<style>body{margin:0;background:var(--surface-dim)} #root{padding:20px}</style></head>
<body>
<div id="root" class="ms-root" dir="ltr"></div>
<script>
  var M = window.Masslak, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:16}},
  h(M.Card,{title:'Your next trip',action:h(M.StatusBadge,{status:'CONFIRMED'},'Confirmed')},h('div',{className:'body-medium ms-muted'},'Damascus → Aleppo · Friday 14:30')),
  h(M.Card,{variant:'flat',title:'Flat card'},h('div',{className:'body-medium ms-muted'},'For dense content inside the portals.')),
  h(M.Card,{variant:'tint',title:'Tinted card'},h('div',{className:'body-medium ms-muted'},'For quiet information or summaries.')),
  h(M.Card,{variant:'hero',title:'Primary card'},h('div',{className:'body-medium ms-muted'},'For the search form and the ticket.'))));
</script>
</body>
</html>
