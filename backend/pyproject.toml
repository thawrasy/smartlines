# Tool settings for the backend (the application itself is configured through MASSLAK_* environment variables).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B608 (SQL built from strings) is skipped on purpose: every query passes values as bound parameters ($1, $2 ...),
# and the only interpolated pieces are constant SQL fragments defined in the same module (column lists, the free
# seat condition, the journey subquery). Code review keeps it that way: no request value is ever formatted into SQL.
skips = ["B608"]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
# pytest fixtures are imported from test_e2e and then named as test arguments, which pyflakes reads as a redefinition
per-file-ignores = { "tests/*" = ["F811"] }

[tool.coverage.run]
# Measured in CI over the unit tests and the API server they call (review of release 1.47.0, R-52): the server runs
# under coverage too, writes its share when stopped (sigterm), and the shares are combined. scripts/coverage_gate.py
# then holds the total and the money, sign-in and isolation modules to their minimums (coverage-thresholds.json).
source = ["app"]
parallel = true
sigterm = true
omit = ["app/tools/*"]   # command-line tools: their tests run them as separate processes

[tool.coverage.report]
skip_empty = true
precision = 1
