# Masslak test/production stack: PostgreSQL with a streaming read replica, PgBouncer in front of it, a one-shot migration,
# the API (which also serves the web interface), the worker, the egress proxy and Caddy as the HTTPS front. Configure with deploy/.env (copy deploy/.env.example).
# Only Caddy and the egress proxy have a route to the internet: the API and the worker reach the outside world through
# the proxy alone (audit T3-02, deploy/egress).
name: masslak

services:
  db:
    image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masslak}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    # client authentication from deploy/postgres (replication for the read replica)
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    networks: [internal]

  # Streaming read replica: reports and exports run here (the API refuses to start in production without it), so heavy
  # queries never slow bookings; also the failover candidate (docs/operations/RUNBOOKS.md, section 3)
  db-replica:
    image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    restart: unless-stopped
    user: postgres
    entrypoint: ["/usr/local/bin/masslak-replica"]
    environment:
      PGDATA: /var/lib/postgresql/data
      MASSLAK_REPLICATION_PASSWORD: ${MASSLAK_REPLICATION_PASSWORD:?set MASSLAK_REPLICATION_PASSWORD in deploy/.env}
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./deploy/postgres/replica.sh:/usr/local/bin/masslak-replica:ro
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q && psql -Atc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      retries: 60
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  migrate:
    build:
      context: .
      args:
        VITE_SHOW_DEMO: ${MASSLAK_SEED_DEMO:-false}
        VITE_DEFAULT_LOCALE: ${MASSLAK_DEFAULT_LOCALE:-ar}
        MASSLAK_RELEASE_COMMIT: ${MASSLAK_RELEASE_COMMIT:-unknown}     # recorded in the release manifest (1058)
    image: masslak:latest
    command: ["/app/deploy/migrate.sh"]
    env_file: deploy/.env
    environment:
      PGHOST: db
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # Connection pooling in transaction mode (capacity model: dozens of API instances share a few hundred database
  # connections). Requests set their context inside each transaction, so a pooled connection never carries a company
  # into the next request; protocol-level prepared statements are kept by PgBouncer (max_prepared_statements).
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3@sha256:377dec3c0e4a66a1077ec043e16a26ed5702a6d954011a7983a1457c2e070b1d
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-masslak}
      DB_USER: masslak_api
      DB_PASSWORD: ${MASSLAK_API_PASSWORD}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "4000"
      DEFAULT_POOL_SIZE: "60"
      RESERVE_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "500"
      SERVER_IDLE_TIMEOUT: "300"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  app:
    image: masslak:latest
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      # through PgBouncer; the audit and report connections stay direct (few, long, read-only)
      MASSLAK_DATABASE_URL: postgresql://masslak_api:${MASSLAK_API_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-masslak}
      MASSLAK_AUDIT_DATABASE_URL: postgresql://masslak_audit:${MASSLAK_AUDIT_PASSWORD}@db:5432/${POSTGRES_DB:-masslak}
      # reports and exports read the replica (required in production)
      MASSLAK_REPORTS_DATABASE_URL: postgresql://masslak_api:${MASSLAK_API_PASSWORD}@db-replica:5432/${POSTGRES_DB:-masslak}
      # Only the Caddy container on the front network may set X-Forwarded-For
      MASSLAK_TRUSTED_PROXIES: 172.30.0.0/24
      # canonical links, sitemap and share cards of the public pages
      MASSLAK_PUBLIC_URL: https://${MASSLAK_DOMAIN:-localhost}
      # Uploaded documents, stored AES-256-GCM encrypted
      MASSLAK_FILES_DIR: /data/files
      # every outbound call (payment providers, SMS, webhooks) goes through the egress proxy
      MASSLAK_EGRESS_PROXY: http://egress:3128
    volumes:
      - files:/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
      db-replica: { condition: service_healthy }
      pgbouncer: { condition: service_started }
      egress: { condition: service_started }
    # front is reachable by Caddy only and has no route out; outbound traffic goes through egress
    networks: [internal, front, egress_in]

  # Sends notifications from the transactional outbox (several replicas can run: events are claimed with SKIP LOCKED)
  worker:
    image: masslak:latest
    restart: unless-stopped
    env_file: deploy/.env
    command: ["python", "-m", "app.modules.notify.worker"]
    environment:
      # through PgBouncer; the audit and report connections stay direct (few, long, read-only)
      MASSLAK_DATABASE_URL: postgresql://masslak_api:${MASSLAK_API_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-masslak}
      MASSLAK_AUDIT_DATABASE_URL: postgresql://masslak_audit:${MASSLAK_AUDIT_PASSWORD}@db:5432/${POSTGRES_DB:-masslak}
      MASSLAK_FILES_DIR: /data/files
      MASSLAK_REPORTS_DATABASE_URL: postgresql://masslak_api:${MASSLAK_API_PASSWORD}@db-replica:5432/${POSTGRES_DB:-masslak}
      MASSLAK_EGRESS_PROXY: http://egress:3128
      # the worker keeps the proxy's allowlist in step with the partner endpoints
      MASSLAK_EGRESS_LISTS: /data/egress-lists
    volumes:
      - files:/data/files
      # With MASSLAK_NOTIFY_EMAIL/SMS=log, messages are written here instead of being sent
      - messages:/data/messages
      - egress_lists:/data/egress-lists
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      egress: { condition: service_started }
    # no route out of its own: SMTP, SMS and webhooks go through egress
    networks: [internal, egress_in]

  # The only way out for the API and the worker: HTTPS and mail submission to allowlisted names, never to private,
  # loopback, link-local or metadata addresses (deploy/egress/squid.conf; probe with deploy/egress/selftest.sh)
  egress:
    build: deploy/egress
    image: masslak-egress:latest
    restart: unless-stopped
    volumes:
      - egress_lists:/etc/squid/lists
    networks:
      egress_in: { ipv4_address: 172.31.0.2 }
      edge: {}

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      MASSLAK_DOMAIN: ${MASSLAK_DOMAIN:-localhost}
      MASSLAK_ACME_EMAIL: ${MASSLAK_ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [front, edge]

networks:
  internal:
    internal: true
  # Caddy to the API; no route out
  front:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # the API and the worker to the egress proxy; no route out
  egress_in:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  # the internet side of Caddy (published ports) and of the egress proxy
  edge: {}

volumes:
  pgdata:
  pgdata_replica:
  files:
  messages:
  caddy_data:
  caddy_config:
  egress_lists:
