# Alertmanager of the production profile (reviews of October 2026, H-07; docs/operations/SLO.md): severity "page" goes
# to the on-call channel at any hour, "ticket" to the team queue, the heartbeat to the dead man's switch. The receiver
# URLs are files in deploy/production/secrets (not committed); deploy/production/init.sh writes placeholders and the
# preflight of deploy/install.sh and deploy/update.sh refuses to go on until they are replaced. Prove the path to the
# person on call with deploy/monitoring/alert-drill.sh.
route:
  receiver: ticket
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # security alerts (area "security", 1167) also go to the security staff's Telegram chats through the API's relay;
    # "continue" lets them reach the page or ticket receiver below as well
    - matchers: ['area="security"']
      receiver: security
      continue: true
      group_by: [alertname, rule]
      repeat_interval: 1h
    # the heartbeat goes to the dead man's switch every minute and nowhere else (R-45)
    - matchers: ['severity="heartbeat"']
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="page"']
      receiver: page
      repeat_interval: 1h
receivers:
  - name: page
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/page_webhook_url
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_webhook_url
        send_resolved: true
  - name: security
    webhook_configs:
      # the API's relay on the alerts network (docker-compose.production.yml); the token is
      # deploy/production/secrets/alert_relay_token, written by init.sh, and the chats are the platform setting
      # security.alert_telegram_chats
      - url: http://app:8000/api/security/relay/alertmanager
        http_config:
          authorization: { type: Bearer, credentials_file: /etc/alertmanager/secrets/alert_relay_token }
        send_resolved: true
        max_alerts: 20
  - name: deadman
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadman_webhook_url
        send_resolved: false
inhibit_rules:
  # a database that is down explains every other database alert
  - source_matchers: ['alertname="DatabaseDown"']
    target_matchers: ['alertname=~"ConnectionsNearLimit|LockQueue|LongTransaction|Deadlocks|VacuumBehind|WraparoundRisk|ReplicaLagging|MaintenanceStale|MetricsMissing"']
