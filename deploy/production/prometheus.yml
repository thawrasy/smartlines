# Prometheus of the production profile (reviews of October 2026, H-07; deploy/monitoring/alerts.yml, docs/operations/SLO.md).
# Scrapes the API (with the token in deploy/production/secrets/metrics_token), PgBouncer's exporter, this host's
# node_exporter, Alertmanager and Prometheus itself, and the second site's node_exporter when one is declared
# (MASSLAK_SITE_B_METRICS in deploy/.env; deploy/production/init.sh writes targets/site-b.yml). A target that stops
# answering, or a metric an alert rests on that stops arriving, raises an alert of its own (MetricsMissing).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: masslak-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["app:8000"]
  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # the second site's node_exporter, whose textfile collector carries the watchdog's figures (deploy/ha/site-b-watchdog.sh)
  - job_name: site-b
    file_sd_configs:
      - files: ["/etc/prometheus/targets/site-b.yml"]
