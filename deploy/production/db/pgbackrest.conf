# pgBackRest in the production database container (deploy/production). The repository itself is set in the
# environment (PGBACKREST_REPO1_*, deploy/.env, passed only to this container by deploy/env-split.sh): object storage
# (s3, gcs, azure), sftp, or a repository host, never a path on this host (the preflight refuses one).
[global]
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass: PGBACKREST_REPO1_CIPHER_PASS, never this file
repo1-retention-full=5
repo1-retention-diff=7
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
# gz: the Alpine package of pgBackRest is built without zstd (every archive with zst failed, CI of 10 October 2026)
compress-type=gz
compress-level=3
start-fast=y
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[masslak]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql

# Schedule (cron on the host, as for deploy/backup.sh):
#   full backup weekly:         docker compose --env-file deploy/.env exec -T -u postgres db pgbackrest --stanza=masslak --type=full backup
#   differential backup daily:  ... --type=diff backup
# Restore to a point in time: docs/operations/RUNBOOKS.md, section 2 (into a new server, never over the primary).
