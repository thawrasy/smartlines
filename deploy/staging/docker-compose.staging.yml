# Staging overlay (owner decision, 8 October 2026; docs/operations/STAGING.md). Run by the external firm that operates
# staging, on production-like hardware, with production-size synthetic data (db/tools/generate_volume.py):
#   docker compose -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml --env-file deploy/.env up -d --build
# On top of the production stack it adds what the launch gates are measured with:
#   * the database with WAL archiving through pgBackRest (RPO 60 s); the read replica (db-replica) comes from the
#     production stack itself;
#   * ClamAV for the file scanner (fail-closed);
#   * Prometheus with the alert rules, Alertmanager, and Grafana with the operations dashboard.
# Paths are relative to the repository root (the directory of the first compose file).

services:
  db:
    build: deploy/staging/db
    image: masslak-staging-db:latest
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=logical
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=masslak archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=20GB
      - -c
      - log_replication_commands=on
      - -c
      - wal_keep_size=1GB
      - -c
      - wal_compression=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      # time spent in each trigger and function (masslak_db_function_seconds_total, trigger cost budget)
      - -c
      - track_functions=pl
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=500ms
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?set PGBACKREST_REPO1_CIPHER_PASS in deploy/.env}
    volumes:
      - pgbackrest_repo:/var/lib/pgbackrest

  app:
    environment:
      MASSLAK_CLAMD: clamav:3310
      MASSLAK_METRICS_TOKEN: ${MASSLAK_METRICS_TOKEN:?set MASSLAK_METRICS_TOKEN in deploy/.env}
    depends_on:
      clamav: { condition: service_healthy }

  worker:
    environment:
      MASSLAK_CLAMD: clamav:3310

  # Virus scanning for uploads (audit T3-15). It needs the internet only for signature updates (freshclam).
  clamav:
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks: [internal, edge]

  prometheus:
    image: prom/prometheus:v2.53.2@sha256:cafe963e591c872d38f3ea41ff8eb22cee97917b7c97b5c0ccd43a419f11f613
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/staging/secrets/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    networks: [internal, monitoring]

  # PgBouncer's pools for Prometheus (code review of October 2026): clients waiting and their longest wait show a pool
  # that is too small before requests time out (alerts PgBouncerClientsWaiting, PgBouncerSlowWait, PgBouncerDown).
  # It reads PgBouncer's admin console as a stats user (STATS_USERS in docker-compose.yml), with no access to data.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2@sha256:5d62f2dc3ed33d091fe8dcf170c8533618c4d00cab61b6a743e0425d57b28924
    restart: unless-stopped
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://masslak_api:${MASSLAK_API_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
    depends_on: [pgbouncer]
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/staging/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/staging/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.2.2@sha256:d5133220d770aba5cb655147b619fa8770b90f41d8489a821d33b1cd34d16f89
    restart: unless-stopped
    # reach it through an SSH tunnel; never published on a public address
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/staging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/masslak.json:ro
      - ./deploy/staging/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana_data:/var/lib/grafana
    networks: [monitoring]

networks:
  # Prometheus, Alertmanager and Grafana; Alertmanager sends notifications from here
  monitoring: {}

volumes:
  pgbackrest_repo:
  clamav_db:
  prometheus_data:
  alertmanager_data:
  grafana_data:
