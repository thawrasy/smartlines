# pgBackRest on staging: same settings as deploy/pitr/pgbackrest.conf, with a local repository volume. To rehearse
# against object storage, set repo1-type=s3 and the bucket of the staging account (never the production bucket).
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass comes from the environment (PGBACKREST_REPO1_CIPHER_PASS), never from this file
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-path=/var/log/pgbackrest

[masslak]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
