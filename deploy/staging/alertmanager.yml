# Alertmanager on staging (audit T3-16, docs/operations/SLO.md): severity "page" goes to the on-call channel at any hour,
# "ticket" to the team queue. The receiver URLs are files in deploy/staging/secrets (not committed).
route:
  receiver: ticket
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="page"']
      receiver: page
      repeat_interval: 1h
receivers:
  - name: page
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/page_webhook_url
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_webhook_url
        send_resolved: true
inhibit_rules:
  # a database that is down explains every other database alert
  - source_matchers: ['alertname="DatabaseDown"']
    target_matchers: ['alertname=~"ConnectionsNearLimit|LockQueue|LongTransaction|Deadlocks|VacuumBehind|WraparoundRisk|ReplicaLagging|MaintenanceStale"']
