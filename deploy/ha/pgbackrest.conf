# pgBackRest with two repositories (expert review of October 2026, stage D6): repo1 in the main site's region, repo2 in
# the second site's. Every WAL segment is archived to both, so losing the main site loses at most what was not yet
# archived (archive_timeout 60 s). Encryption passphrases come from the key service (PGBACKREST_REPO1_CIPHER_PASS,
# PGBACKREST_REPO2_CIPHER_PASS), never from this file. Replaces deploy/pitr/pgbackrest.conf on the Patroni servers.
[global]
repo1-type=s3
repo1-s3-bucket=masslak-backups
repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
repo1-s3-region=eu-central-1
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=5
repo1-retention-diff=7

repo2-type=s3
repo2-s3-bucket=masslak-backups-site-b
repo2-s3-endpoint=s3.eu-west-1.amazonaws.com
repo2-s3-region=eu-west-1
repo2-path=/pgbackrest
repo2-cipher-type=aes-256-cbc
repo2-retention-full=3

archive-async=y
spool-path=/var/spool/pgbackrest
process-max=4
compress-type=zst
start-fast=y
# backups are taken from a standby, never loading the primary
backup-standby=y
log-level-console=info

[masslak]
pg1-host=db-a1.internal
pg1-path=/var/lib/postgresql/16/main
pg2-host=db-a2.internal
pg2-path=/var/lib/postgresql/16/main

# Schedule (cron on the backup host):
#   full weekly, to both:       pgbackrest --stanza=masslak --type=full --repo=1 backup && pgbackrest --stanza=masslak --type=full --repo=2 backup
#   differential daily, repo1:  pgbackrest --stanza=masslak --type=diff --repo=1 backup
#   check archiving hourly:     pgbackrest --stanza=masslak check
