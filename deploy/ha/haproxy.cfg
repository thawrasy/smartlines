# HAProxy in front of the Patroni servers (expert review of October 2026, stage D6). Patroni's REST API answers 200 on
# /primary only on the primary and on /replica only on a streaming standby, so port 5000 always reaches the primary
# and port 5001 a standby, whichever server holds the role. PgBouncer points at port 5000; reports at port 5001.
global
    maxconn 4000

defaults
    mode tcp
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s

listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    # a server that lost the role is marked down within 3 s, and its open connections are cut, so clients reconnect
    # to the new primary instead of waiting on a server that can no longer write
    default-server inter 1s fall 3 rise 2 on-marked-down shutdown-sessions
    server db-a1 db-a1.internal:5432 maxconn 1000 check port 8008
    server db-a2 db-a2.internal:5432 maxconn 1000 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica?lag=30s
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server db-a1 db-a1.internal:5432 maxconn 500 check port 8008
    server db-a2 db-a2.internal:5432 maxconn 500 check port 8008

listen stats
    mode http
    bind 127.0.0.1:7000
    stats enable
    stats uri /
