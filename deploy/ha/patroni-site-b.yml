# Patroni at the second site (expert review of October 2026, stage D6; docs/operations/HIGH_AVAILABILITY.md).
# A standby cluster: its leader streams from the main site's primary (through HAProxy) and falls back to the WAL in
# the second site's backup repository (repo2) when the link is down. It never promotes itself: losing the main site
# is declared by a person (RUNBOOKS.md, section 23), who then removes standby_cluster from the dynamic configuration:
#   patronictl -c /etc/patroni/patroni.yml edit-config --force --set standby_cluster=null
scope: masslak-site-b
namespace: /masslak/
name: db-b1

restapi:
  listen: 0.0.0.0:8008
  connect_address: db-b1.internal:8008

etcd3:
  hosts: etcd-b1.internal:2379,etcd-b2.internal:2379,etcd-b3.internal:2379   # the second site's own vote

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    standby_cluster:
      host: db-primary.main-site.internal     # HAProxy at the main site, port 5000: always the primary
      port: 5000
      create_replica_methods: [pgbackrest, basebackup]
      restore_command: pgbackrest --stanza=masslak --repo=2 archive-get %f "%p"
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: logical
        max_connections: 200                  # CAPACITY_MODEL.md, section 10; equal on every member
        max_slot_wal_keep_size: 20GB
        hot_standby: "on"
        wal_log_hints: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        archive_mode: "on"
        archive_command: pgbackrest --stanza=masslak archive-push %p
        archive_timeout: 60

postgresql:
  listen: 0.0.0.0:5432
  connect_address: db-b1.internal:5432
  data_dir: /var/lib/postgresql/16/main
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /var/lib/postgresql/.pgpass_patroni
  authentication:
    superuser:
      username: postgres
    replication:
      username: replicator
  create_replica_methods: [pgbackrest, basebackup]
  pgbackrest:
    command: pgbackrest --stanza=masslak --repo=2 --delta --type=standby restore
    keep_data: true
    no_params: true
  pg_hba:
    - local all all peer
    - host replication replicator 10.0.0.0/8 scram-sha-256
    - host all all 10.0.0.0/8 scram-sha-256

tags:
  nofailover: false
