      - alert: ScrapeTargetDown
        expr: up{job!="masslak-api"} == 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Prometheus cannot read {{ $labels.job }} ({{ $labels.instance }})", runbook: "RUNBOOKS.md#31-the-production-profile-reviews-of-october-2026-package-2" }
      # the second site, when one is declared (MASSLAK_SITE_B_METRICS): its node_exporter answers but carries no
      # figures from the watchdog (the watchdog timer stopped, or its textfile directory is not collected)
      - alert: SiteBWatchdogMissing
        expr: absent(masslak_site_b_watchdog_last_run_timestamp_seconds) and on() count(up{job="site-b"} == 1) > 0
        for: 10m
        labels: { severity: page }
        annotations: { summary: "The second site is scraped but its watchdog's figures are missing", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      # the host itself (node_exporter, production profile and staging)
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"} < 0.10
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Less than 10 % free on {{ $labels.mountpoint }}: the database stops writing when its disk is full", runbook: "RUNBOOKS.md#31-the-production-profile-reviews-of-october-2026-package-2" }
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Less than 5 % of the host's memory is available", runbook: "RUNBOOKS.md#31-the-production-profile-reviews-of-october-2026-package-2" }
