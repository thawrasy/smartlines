# Alert rules (audit T3-16). Each alert names its SLO or check and the runbook section to follow
# (docs/operations/RUNBOOKS.md); severity "page" wakes the on-call engineer, "ticket" waits for working hours.
groups:
  - name: masslak-slo
    rules:
      # Always firing (review of 1.47.0, R-45): Alertmanager sends it every minute to an external dead man's switch, which
      # pages through its own channel when it stops arriving: Prometheus, Alertmanager or the receivers are then down
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: heartbeat }
        annotations: { summary: "Alerting works end to end (dead man's switch)", runbook: "RUNBOOKS.md#28-logs-traces-and-slow-statements-148" }
      # Booking, payment and search availability: fast and slow burn of the 99.9 % error budget (multi-window)
      - alert: BookingErrorBudgetFastBurn
        expr: |
          (sum(rate(masslak_http_requests_total{group=~"booking|payment",status="5xx"}[5m])) / clamp_min(sum(rate(masslak_http_requests_total{group=~"booking|payment"}[5m])), 1e-9) > 14.4 * 0.001)
          and
          (sum(rate(masslak_http_requests_total{group=~"booking|payment",status="5xx"}[1h])) / clamp_min(sum(rate(masslak_http_requests_total{group=~"booking|payment"}[1h])), 1e-9) > 14.4 * 0.001)
        labels: { severity: page }
        annotations: { summary: "Bookings or payments are failing (2 % of the monthly error budget in one hour)", runbook: "RUNBOOKS.md#1-incident-response" }
      - alert: BookingErrorBudgetSlowBurn
        expr: |
          (sum(rate(masslak_http_requests_total{group=~"booking|payment",status="5xx"}[6h])) / clamp_min(sum(rate(masslak_http_requests_total{group=~"booking|payment"}[6h])), 1e-9) > 6 * 0.001)
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Bookings or payments fail more than the SLO allows", runbook: "RUNBOOKS.md#1-incident-response" }
      - alert: BookingLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(masslak_http_request_duration_seconds_bucket{group="booking"}[10m]))) > 1.5
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Booking p99 latency above 1.5 s", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: SearchLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(masslak_http_request_duration_seconds_bucket{group="search"}[10m]))) > 0.5
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Search p95 latency above 0.5 s", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: TrackingIngestionFailing
        expr: sum(rate(masslak_http_requests_total{group="tracking",status="5xx"}[10m])) / clamp_min(sum(rate(masslak_http_requests_total{group="tracking"}[10m])), 1e-9) > 0.005
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Driver positions are being refused (above 0.5 %)", runbook: "RUNBOOKS.md#1-incident-response" }
  - name: masslak-pipeline
    rules:
      - alert: OutboxBacklog
        expr: masslak_outbox_oldest_pending_seconds > 300
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Events wait more than 5 minutes in the outbox (worker down or stuck)", runbook: "RUNBOOKS.md#3-failover" }
      - alert: OutboxEventsFailed
        expr: masslak_outbox_dead > 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Events gave up after eight attempts and wait for an operator (notifications not sent, partners not told)", runbook: "RUNBOOKS.md#16-resending-money-and-authority-events-t3-12" }
      - alert: WebhookDeliveriesDead
        expr: increase(masslak_webhook_deliveries{status="DEAD"}[1h]) > 0 or masslak_webhook_deliveries{status="DEAD"} > 20
        labels: { severity: ticket }
        annotations: { summary: "Partner webhook deliveries gave up after eight attempts", runbook: "../integration/EVENTS.md#replays" }
      - alert: FilesWaitingForScan
        expr: masslak_files_oldest_pending_scan_seconds > 900
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Uploaded files wait more than 15 minutes for the virus scan (ClamAV down?)", runbook: "RUNBOOKS.md#12-file-scanning-t3-15" }
      - alert: PositionPartitionMissing
        expr: masslak_geo_partitions_missing > 0
        for: 15m
        labels: { severity: page }
        annotations: { summary: "Today's or tomorrow's position partition is missing (daily upkeep not running)", runbook: "RUNBOOKS.md#9-data-lifecycle-r-11" }
      - alert: TelemetryDown
        expr: masslak_telemetry_up == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: "The telemetry database does not answer: positions are refused (the apps keep and resend them) and their history waits", runbook: "RUNBOOKS.md#22-telemetry-database-review-stage-d" }
      - alert: TelemetryPartitionMissing
        expr: masslak_telemetry_partitions_missing > 0
        for: 15m
        labels: { severity: page }
        annotations: { summary: "Today's or tomorrow's partition of the telemetry database is missing (worker upkeep not running)", runbook: "RUNBOOKS.md#22-telemetry-database-review-stage-d" }
      - alert: MaintenanceStale
        expr: masslak_job_last_success_age_seconds{task="maintenance"} > 26 * 3600
        labels: { severity: page }
        annotations: { summary: "The daily upkeep has not succeeded for more than 26 hours", runbook: "RUNBOOKS.md#9-data-lifecycle-r-11" }
      - alert: WalletMismatch
        expr: masslak_wallet_mismatches > 0
        labels: { severity: page }
        annotations: { summary: "Wallet balances disagree with the ledger: freeze payouts", runbook: "RUNBOOKS.md#8-alerts-the-database-raises" }
      - alert: PaymentMismatch
        expr: masslak_payment_mismatches > 0
        labels: { severity: page }
        annotations: { summary: "Payments, refunds, provider notices and the ledger disagree: freeze payouts", runbook: "RUNBOOKS.md#16-resending-money-and-authority-events-t3-12" }
      - alert: PaymentCapturedLate
        expr: increase(masslak_payments_captured_late_total[1h]) > 0
        labels: { severity: ticket }
        annotations: { summary: "A provider confirmed a payment after the platform stopped waiting: the money is in the payer's wallet", runbook: "RUNBOOKS.md#16-resending-money-and-authority-events-t3-12" }
      - alert: RefundOutcomeUnknown
        expr: masslak_refunds_waiting_provider > 0
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Refunds have waited over an hour for their provider to say whether it paid them; the amounts stay held", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - alert: PaymentProviderCircuitOpen
        expr: max by (provider) (masslak_payment_provider_circuit_open) == 1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "A payment provider has not answered for five minutes: payments and refunds through it are refused", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - alert: ApprovalsWaiting
        expr: masslak_approvals_oldest_pending_seconds > 86400
        labels: { severity: ticket }
        annotations: { summary: "A money decision has waited a day for its approval levels", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - alert: UnsignedNoticesBurst
        expr: max by (provider) (masslak_payment_unsigned_notices_last_hour) > 20
        labels: { severity: ticket }
        annotations: { summary: "Many provider notices with a bad signature in the last hour: someone may be probing the endpoint", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - alert: PositionBacklogGrowing
        expr: masslak_position_backlog_oldest_seconds > 900
        labels: { severity: ticket }
        annotations: { summary: "Vehicle positions have waited more than 15 minutes on the primary for the telemetry database", runbook: "RUNBOOKS.md#26-sign-in-boarding-and-positions-148" }
      - alert: MfaCodesFailing
        expr: sum(increase(masslak_mfa_codes_total{outcome="failed"}[15m])) > 5
        labels: { severity: ticket }
        annotations: { summary: "Sign-in codes by text or WhatsApp message are failing to leave: staff may be unable to sign in", runbook: "RUNBOOKS.md#26-sign-in-boarding-and-positions-148" }
      - alert: ReviewQueuesWaiting
        expr: masslak_violations_awaiting_review > 0 or masslak_delivery_retries_waiting > 0
        for: 48h
        labels: { severity: ticket }
        annotations: { summary: "Violations on low-trust evidence or resends of money events wait for a person for 2 days", runbook: "RUNBOOKS.md#15-position-evidence-and-violation-review-t3-11" }
      - alert: ReleaseRecordChanged
        expr: masslak_release_hash_matches == 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "The record of applied schema files no longer matches the release manifest: the next upgrade will refuse to run", runbook: "RUNBOOKS.md#4-migrations-on-a-live-database" }
      - alert: CashOverdue
        expr: masslak_cash_overdue_minor > 0
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "Carriers owe counter cash sold more than 30 days ago: chase the remittance or lower their cash limit", runbook: "RUNBOOKS.md#18-counter-cash-and-report-freshness-review-stage-b" }
      - alert: CashNearLimit
        expr: masslak_cash_near_limit_carriers > 0
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "A carrier owes 90 % of its cash limit: its counter sales stop at the limit", runbook: "RUNBOOKS.md#18-counter-cash-and-report-freshness-review-stage-b" }
      - alert: BreakGlassUnreviewed
        expr: masslak_break_glass_unreviewed > 0
        labels: { severity: ticket }
        annotations: { summary: "A break-glass access ended more than 24 hours ago without a review", runbook: "RUNBOOKS.md#11-break-glass-access-t3-03" }
  - name: masslak-database
    rules:
      - alert: DatabaseDown
        expr: masslak_db_up == 0 or up{job="masslak-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "The API cannot read the database, or the API is down", runbook: "RUNBOOKS.md#3-failover" }
      - alert: WalArchiveStale
        # archive_timeout is 60 s, so a healthy server archives at least every minute (review of 1.47.0, R-40)
        expr: masslak_db_archive_mode_on == 1 and masslak_db_wal_archive_last_success_age_seconds > 90
        for: 1m
        labels: { severity: page }
        annotations: { summary: "No WAL archived for 90 seconds: point-in-time recovery is at risk (RPO)", runbook: "RUNBOOKS.md#2-backup-and-point-in-time-restore-rpo-and-rto" }
      - alert: BackupStale
        expr: masslak_backup_last_success_age_seconds{copy="local"} > 93600
        labels: { severity: page }
        annotations: { summary: "No nightly backup for more than 26 hours", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - alert: BackupOffsiteStale
        expr: masslak_backup_last_success_age_seconds{copy="offsite"} > 93600
        labels: { severity: page }
        annotations: { summary: "No backup copied off the server for more than 26 hours: losing this server would lose its backups too", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - alert: ZeroDataLossNotEnforced
        expr: max(masslak_zero_data_loss_configured) == 1 and max(masslak_db_commits_wait_for_standby) == 0
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Zero data loss is on, but commits do not wait for a standby: run deploy/durability.sh", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - alert: CommitsWaitingForStandby
        expr: max(masslak_db_commits_wait_for_standby) == 1 and sum(masslak_db_standbys{sync="sync"}) < 1
        for: 1m
        labels: { severity: page }
        annotations: { summary: "Every commit waits for a standby and none is confirming: bookings and payments are paused", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - alert: SiteBNotStreaming
        expr: masslak_site_b_streaming == 0 and masslak_site_b_in_recovery == 1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "The second site receives no WAL from the main site", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - alert: MainSiteUnreachableFromSiteB
        expr: masslak_site_b_main_reachable == 0
        for: 3m
        labels: { severity: page }
        annotations: { summary: "The second site cannot reach the main site's primary: decide whether the main site is lost (never automatic)", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - alert: SiteBLagging
        expr: masslak_site_b_replay_lag_seconds > 300
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "The second site replays the main site's changes more than 5 minutes late", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - alert: SiteBWatchdogStale
        expr: time() - masslak_site_b_watchdog_last_run_timestamp_seconds > 300
        labels: { severity: ticket }
        annotations: { summary: "The second site's watchdog has not run for 5 minutes (masslak-site-b-watchdog.timer)", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - alert: WalArchiveFailing
        expr: increase(masslak_db_wal_archive_failed_total[15m]) > 0
        labels: { severity: page }
        annotations: { summary: "WAL archiving fails", runbook: "RUNBOOKS.md#2-backup-and-point-in-time-restore-rpo-and-rto" }
      - alert: ReplicaLagging
        expr: max(masslak_db_replication_lag_seconds) > 30
        for: 5m
        labels: { severity: page }
        annotations: { summary: "The standby is more than 30 s behind: a failover would lose data", runbook: "RUNBOOKS.md#3-failover" }
      - alert: NoFailoverCandidate
        expr: max(masslak_db_in_recovery) == 0 and sum(masslak_db_standbys) < 1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "No standby streams from the primary: a failure now would stop bookings until a restore", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - alert: NoSynchronousStandby
        expr: max(masslak_db_in_recovery) == 0 and sum(masslak_db_standbys{sync="sync"}) < 1 and sum(masslak_db_standbys) >= 1
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "No standby confirms commits synchronously: a failover now could lose the last transactions", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - alert: ReplicationSlotRetainingWal
        expr: max by (slot) (masslak_replication_slot_retained_bytes) > 5e9
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Replication slot {{ $labels.slot }} holds back more than 5 GB of WAL (its reader is behind or stopped); at max_slot_wal_keep_size the primary drops it", runbook: "RUNBOOKS.md#21-data-warehouse-review-stage-d" }
      - alert: ReplicationSlotForeignPlugin
        expr: max by (slot) (masslak_replication_slot_foreign_plugin) > 0
        labels: { severity: page }
        annotations: { summary: "Replication slot {{ $labels.slot }} decodes with a plugin other than pgoutput: it can read every table, personal data included", runbook: "RUNBOOKS.md#21-data-warehouse-review-stage-d" }
      - alert: ReplicationSlotInactive
        expr: max by (slot) (masslak_replication_slot_active) == 0
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Nothing has read replication slot {{ $labels.slot }} for 30 minutes (warehouse or standby down)", runbook: "RUNBOOKS.md#21-data-warehouse-review-stage-d" }
      - alert: ConnectionsNearLimit
        expr: sum(masslak_db_connections) / max(masslak_db_connections_max) > 0.8
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Database connections above 80 % of the limit", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: LockQueue
        expr: masslak_db_lock_waiters > 10
        for: 2m
        labels: { severity: page }
        annotations: { summary: "More than 10 sessions wait on locks", runbook: "../database/MIGRATION_PLANS.md#stop-criteria" }
      - alert: LockWaitsOnTable
        expr: max by (table) (masslak_lock_wait_seconds_max) > 3
        for: 2m
        labels: { severity: ticket }
        annotations: { summary: "Sessions keep waiting more than 3 s for locks on {{ $labels.table }} (the API gives up at 5 s)", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" }
      - alert: PoolWaits
        expr: histogram_quantile(0.99, sum by (le) (rate(masslak_db_pool_acquire_seconds_bucket[5m]))) > 0.25
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Requests wait more than 250 ms for a database connection (pool or PgBouncer too small, or slow transactions)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: AuditWriteFailures
        expr: increase(masslak_audit_write_failures_total[10m]) > 0
        labels: { severity: ticket }
        annotations: { summary: "Request records could not be written to the activity log (data changes are still in audit.row_change)", runbook: "RUNBOOKS.md#7-audit-archive-with-object-lock-r-09" }
      - alert: AuditArchiveBehind
        expr: max(masslak_audit_unarchived_seconds) > 7200
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Audit records older than two hours are not in the signed archive (export, sync or record stopped, or never set up)", runbook: "RUNBOOKS.md#7-audit-archive-with-object-lock-r-09" }
      - alert: PoolTimeouts
        expr: increase(masslak_db_pool_timeouts_total[5m]) > 0
        labels: { severity: page }
        annotations: { summary: "Requests were answered busy: no database connection became free within 5 s", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: PgBouncerDown
        expr: pgbouncer_up == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "PgBouncer does not answer its exporter: the API cannot reach the database", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: PgBouncerClientsWaiting
        expr: max(pgbouncer_pools_client_waiting_connections{database!="pgbouncer"}) > 0
        for: 2m
        labels: { severity: ticket }
        annotations: { summary: "Clients keep waiting for a PgBouncer server connection: DEFAULT_POOL_SIZE is too small or transactions too slow", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: PgBouncerSlowWait
        expr: max(pgbouncer_pools_client_maxwait_seconds{database!="pgbouncer"}) > 1
        for: 2m
        labels: { severity: page }
        annotations: { summary: "A client has waited more than 1 s for a PgBouncer server connection", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: PartitionsRunningOut
        expr: masslak_partition_ahead_seconds{period="day"} < 3 * 86400 or masslak_partition_ahead_seconds{period="month"} < 45 * 86400
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Partitions of {{ $labels.table }} end soon: the daily upkeep has not created the next ones", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" }
      - alert: RowsInDefaultPartition
        expr: masslak_partition_default_rows > 0
        for: 15m
        labels: { severity: page }
        annotations: { summary: "Rows of {{ $labels.table }} fell into its default partition: a partition is missing", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" }
      - alert: LongTransaction
        expr: masslak_db_longest_transaction_seconds > 300 or masslak_db_idle_in_transaction > 5
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "A transaction runs for more than 5 minutes, or sessions sit idle inside transactions", runbook: "RUNBOOKS.md#4-migrations-on-a-live-database" }
      - alert: Deadlocks
        expr: increase(masslak_db_deadlocks_total[15m]) > 0
        labels: { severity: ticket }
        annotations: { summary: "Deadlocks occurred (the booking path is designed to have none)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: VacuumBehind
        expr: max(masslak_db_dead_tuples) > 5e6 or masslak_db_vacuum_age_seconds > 7 * 86400
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "Autovacuum is falling behind on a hot table", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: WraparoundRisk
        expr: masslak_db_xid_age > 1.2e9
        labels: { severity: page }
        annotations: { summary: "Transaction id age approaching wraparound", runbook: "RUNBOOKS.md#1-incident-response" }
  # Growth and cost (architecture review of design 3.9): act before a table or a trigger becomes the bottleneck
  - name: masslak-capacity
    rules:
      - alert: OutboxPartitioningDue
        expr: masslak_outbox_partitioning_due > 0
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "The outbox passed capacity.outbox_partition_rows: partition it by day in the next release", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: OutboxPurgeBehind
        expr: masslak_outbox_purge_backlog > 100000
        for: 6h
        labels: { severity: ticket }
        annotations: { summary: "Published events past their retention are not being purged", runbook: "RUNBOOKS.md#9-data-lifecycle-r-11" }
      - alert: TriggerCostOverBudget
        expr: |
          (rate(masslak_db_function_seconds_total{function=~".*\\.tg_.*"}[15m]) / clamp_min(rate(masslak_db_function_calls_total{function=~".*\\.tg_.*"}[15m]), 1e-9) > 0.001)
          and rate(masslak_db_function_calls_total{function=~".*\\.tg_.*"}[15m]) > 1
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "A trigger spends more than 1 ms per row (cost budget, STANDARDS.md)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - alert: WalletRollupLagging
        expr: masslak_wallet_rollup_lag_seconds > 300
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Entries of shared wallets wait more than 5 minutes for the roll-up (worker down?); balances still count them, closing days waits", runbook: "RUNBOOKS.md#17-ten-million-operations-a-day" }
      - alert: LedgerDaysNotClosing
        expr: masslak_ledger_open_days > 2
        for: 6h
        labels: { severity: ticket }
        annotations: { summary: "Ledger days are not being closed (daily upkeep, a long transaction, or the roll-up behind)", runbook: "RUNBOOKS.md#17-ten-million-operations-a-day" }
  - name: masslak-observability
    rules:
      # A metric an alert rests on that stops arriving silences that alert instead of firing it (reviews of October
      # 2026, the assessment's addition 2): each metric below is always exported while its source works, and its
      # absence is an alert of its own, naming the metric. A database that is down explains every database metric
      # (Alertmanager inhibits this alert while DatabaseDown fires). Keep the list in step with alerts_test.yml.
      - alert: MetricsMissing
        expr: |
          label_replace(absent(up{job="masslak-api"}), "metric", "up{job=masslak-api}", "", "")
          or label_replace(absent(up{job="pgbouncer"}), "metric", "up{job=pgbouncer}", "", "")
          or label_replace(absent(up{job="node"}), "metric", "up{job=node}", "", "")
          or label_replace(absent(masslak_db_up), "metric", "masslak_db_up", "", "")
          or label_replace(absent(masslak_db_connections), "metric", "masslak_db_connections", "", "")
          or label_replace(absent(masslak_db_connections_max), "metric", "masslak_db_connections_max", "", "")
          or label_replace(absent(masslak_db_lock_waiters), "metric", "masslak_db_lock_waiters", "", "")
          or label_replace(absent(masslak_db_longest_transaction_seconds), "metric", "masslak_db_longest_transaction_seconds", "", "")
          or label_replace(absent(masslak_db_idle_in_transaction), "metric", "masslak_db_idle_in_transaction", "", "")
          or label_replace(absent(masslak_db_deadlocks_total), "metric", "masslak_db_deadlocks_total", "", "")
          or label_replace(absent(masslak_db_dead_tuples), "metric", "masslak_db_dead_tuples", "", "")
