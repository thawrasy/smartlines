# promtool test rules deploy/monitoring/alerts_test.yml  (audit T3-16: the alerts fire on the conditions they name)
rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: { severity: heartbeat }
            exp_annotations: { summary: "Alerting works end to end (dead man's switch)", runbook: "RUNBOOKS.md#28-logs-traces-and-slow-statements-148" }
  - interval: 1m
    input_series:
      - series: masslak_wallet_mismatches
        values: "0 0 2 2"
      - series: masslak_outbox_oldest_pending_seconds
        values: "10 400 400 400 400 400 400 400 400 400 400 400 400 400"
      - series: masslak_geo_partitions_missing
        values: "0x5 1x20"
      - series: masslak_db_archive_mode_on
        values: "1x20"
      - series: masslak_db_wal_archive_last_success_age_seconds
        values: "30 400 460 520 580 640 700 760 820 880"
      - series: 'masslak_http_requests_total{group="booking",status="2xx",method="POST",route="/api/bookings"}'
        values: "0+100x70"
      - series: 'masslak_http_requests_total{group="booking",status="5xx",method="POST",route="/api/bookings"}'
        values: "0+10x70"
      - series: masslak_outbox_partitioning_due
        values: "0x10 1x80"
      - series: 'masslak_db_function_calls_total{function="audit.tg_capture_change"}'
        values: "0+600x60"
      - series: 'masslak_db_function_seconds_total{function="audit.tg_capture_change"}'
        values: "0+1.2x60"
      - series: 'masslak_db_function_calls_total{function="sys.tg_set_updated_at"}'
        values: "0+600x60"
      - series: 'masslak_db_function_seconds_total{function="sys.tg_set_updated_at"}'
        values: "0+0.01x60"
      - series: masslak_wallet_rollup_lag_seconds
        values: "5x10 900x30"
      - series: masslak_ledger_open_days
        values: "1x10 3x400"
      - series: masslak_cash_overdue_minor
        values: "0x10 150000x90"
      - series: masslak_cash_near_limit_carriers
        values: "0x5 1x60"
      - series: masslak_release_hash_matches
        values: "1x10 0x20"
      - series: masslak_db_in_recovery
        values: "0x40"
      - series: 'masslak_db_standbys{sync="sync"}'
        values: "1x5 0x35"
      - series: 'masslak_db_standbys{sync="async"}'
        values: "0x5 1x10 0x25"
      - series: masslak_telemetry_up
        values: "1x5 0x20"
      - series: masslak_telemetry_partitions_missing
        values: "0x5 1x30"
      - series: 'masslak_replication_slot_retained_bytes{slot="masslak_dw",kind="logical"}'
        values: "1e8x10 6e9x30"
      - series: 'masslak_replication_slot_active{slot="masslak_dw",kind="logical"}'
        values: "1x10 0x50"
      - series: 'masslak_replication_slot_foreign_plugin{slot="masslak_dw",kind="logical"}'
        values: "0x60"
      - series: 'masslak_replication_slot_foreign_plugin{slot="peek",kind="logical"}'
        values: "_x5 1x10"
      - series: 'masslak_lock_wait_seconds_max{table="ops.seat_segment"}'
        values: "1 4 4 4 4 4 1"
      - series: 'masslak_lock_wait_seconds_max{table="fin.wallet"}'
        values: "4 1 4 1 4 1 4"
      - series: 'masslak_partition_ahead_seconds{table="sys.outbox_event",period="day"}'
        values: "604800x10 172800x60"
      - series: 'masslak_partition_ahead_seconds{table="fin.ledger_entry",period="month"}'
        values: "9000000x100"
      - series: 'masslak_partition_default_rows{table="fin.ledger_entry"}'
        values: "0x5 12x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket{le="0.25"}'
        values: "0+100x10 1000+10x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket{le="1"}'
        values: "0+100x10 1000+100x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket{le="+Inf"}'
        values: "0+100x10 1000+100x30"
      - series: masslak_outbox_dead
        values: "0x10 2x20"
      - series: masslak_db_pool_timeouts_total
        values: "0x10 3x5 3x20"
      - series: pgbouncer_up
        values: "1x10 0x10"
      - series: 'pgbouncer_pools_client_waiting_connections{database="masslak",user="masslak_api"}'
        values: "0x10 4x10"
      - series: 'pgbouncer_pools_client_waiting_connections{database="pgbouncer",user="pgbouncer"}'
        values: "3x30"
      - series: 'pgbouncer_pools_client_maxwait_seconds{database="masslak",user="masslak_api"}'
        values: "0x10 2x10"
      - series: masslak_audit_write_failures_total
        values: "0x10 1x30"
      - series: 'masslak_audit_unarchived_seconds{table="audit.activity_log"}'
        values: "1800+60x120"
      - series: 'masslak_audit_unarchived_seconds{table="audit.row_change"}'
        values: "600x60"
      - series: masslak_payments_captured_late_total
        values: "0x10 1x80"
    alert_rule_test:
      - eval_time: 9m
        alertname: PaymentCapturedLate
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentCapturedLate
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "A provider confirmed a payment after the platform stopped waiting: the money is in the payer's wallet", runbook: "RUNBOOKS.md#16-resending-money-and-authority-events-t3-12" }
      - eval_time: 80m
        alertname: PaymentCapturedLate
        exp_alerts: []
      - eval_time: 9m
        alertname: AuditWriteFailures
        exp_alerts: []
      - eval_time: 14m
        alertname: AuditWriteFailures
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Request records could not be written to the activity log (data changes are still in audit.row_change)", runbook: "RUNBOOKS.md#7-audit-archive-with-object-lock-r-09" }
      - eval_time: 30m
        alertname: AuditWriteFailures
        exp_alerts: []
      - eval_time: 80m
        alertname: AuditArchiveBehind
        exp_alerts: []
      - eval_time: 109m
        alertname: AuditArchiveBehind
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Audit records older than two hours are not in the signed archive (export, sync or record stopped, or never set up)", runbook: "RUNBOOKS.md#7-audit-archive-with-object-lock-r-09" }
      - eval_time: 8m
        alertname: OutboxEventsFailed
        exp_alerts: []
      - eval_time: 18m
        alertname: OutboxEventsFailed
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Events gave up after eight attempts and wait for an operator (notifications not sent, partners not told)", runbook: "RUNBOOKS.md#16-resending-money-and-authority-events-t3-12" }
      - eval_time: 9m
        alertname: PoolTimeouts
        exp_alerts: []
      - eval_time: 12m
        alertname: PoolTimeouts
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Requests were answered busy: no database connection became free within 5 s", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - eval_time: 25m
        alertname: PoolTimeouts
        exp_alerts: []
      - eval_time: 9m
        alertname: PgBouncerDown
        exp_alerts: []
      - eval_time: 13m
        alertname: PgBouncerDown
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "PgBouncer does not answer its exporter: the API cannot reach the database", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - eval_time: 9m
        alertname: PgBouncerClientsWaiting
        exp_alerts: []
      - eval_time: 13m
        alertname: PgBouncerClientsWaiting
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Clients keep waiting for a PgBouncer server connection: DEFAULT_POOL_SIZE is too small or transactions too slow", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - eval_time: 13m
        alertname: PgBouncerSlowWait
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "A client has waited more than 1 s for a PgBouncer server connection", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" }
      - eval_time: 30m
        alertname: CashOverdue
        exp_alerts: []
      - eval_time: 75m
        alertname: CashOverdue
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Carriers owe counter cash sold more than 30 days ago: chase the remittance or lower their cash limit", runbook: "RUNBOOKS.md#18-counter-cash-and-report-freshness-review-stage-b" } }]
      - eval_time: 4m
        alertname: LockWaitsOnTable
        exp_alerts: [{ exp_labels: { severity: ticket, table: ops.seat_segment }, exp_annotations: { summary: "Sessions keep waiting more than 3 s for locks on ops.seat_segment (the API gives up at 5 s)", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" } }]
      - eval_time: 45m
        alertname: PartitionsRunningOut
        exp_alerts: [{ exp_labels: { severity: ticket, table: sys.outbox_event, period: day }, exp_annotations: { summary: "Partitions of sys.outbox_event end soon: the daily upkeep has not created the next ones", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" } }]
      - eval_time: 25m
        alertname: RowsInDefaultPartition
        exp_alerts: [{ exp_labels: { severity: page, table: fin.ledger_entry }, exp_annotations: { summary: "Rows of fin.ledger_entry fell into its default partition: a partition is missing", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" } }]
      - eval_time: 30m
        alertname: PoolWaits
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Requests wait more than 250 ms for a database connection (pool or PgBouncer too small, or slow transactions)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" } }]
      - eval_time: 8m
        alertname: PoolWaits
        exp_alerts: []
      - eval_time: 18m
        alertname: ReleaseRecordChanged
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "The record of applied schema files no longer matches the release manifest: the next upgrade will refuse to run", runbook: "RUNBOOKS.md#4-migrations-on-a-live-database" } }]
      - eval_time: 40m
        alertname: CashNearLimit
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "A carrier owes 90 % of its cash limit: its counter sales stop at the limit", runbook: "RUNBOOKS.md#18-counter-cash-and-report-freshness-review-stage-b" } }]
      - eval_time: 25m
        alertname: WalletRollupLagging
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Entries of shared wallets wait more than 5 minutes for the roll-up (worker down?); balances still count them, closing days waits", runbook: "RUNBOOKS.md#17-ten-million-operations-a-day" } }]
      - eval_time: 380m
        alertname: LedgerDaysNotClosing
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Ledger days are not being closed (daily upkeep, a long transaction, or the roll-up behind)", runbook: "RUNBOOKS.md#17-ten-million-operations-a-day" } }]
      - eval_time: 75m
        alertname: OutboxPartitioningDue
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "The outbox passed capacity.outbox_partition_rows: partition it by day in the next release", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" } }]
      - eval_time: 50m
        alertname: TriggerCostOverBudget
        exp_alerts: [{ exp_labels: { severity: ticket, function: audit.tg_capture_change }, exp_annotations: { summary: "A trigger spends more than 1 ms per row (cost budget, STANDARDS.md)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" } }]
      - eval_time: 3m
        alertname: WalletMismatch
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Wallet balances disagree with the ledger: freeze payouts", runbook: "RUNBOOKS.md#8-alerts-the-database-raises" } }]
      - eval_time: 12m
        alertname: OutboxBacklog
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Events wait more than 5 minutes in the outbox (worker down or stuck)", runbook: "RUNBOOKS.md#3-failover" } }]
      - eval_time: 25m
        alertname: PositionPartitionMissing
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Today's or tomorrow's position partition is missing (daily upkeep not running)", runbook: "RUNBOOKS.md#9-data-lifecycle-r-11" } }]
      - eval_time: 9m
        alertname: WalArchiveStale
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "No WAL archived for 90 seconds: point-in-time recovery is at risk (RPO)", runbook: "RUNBOOKS.md#2-backup-and-point-in-time-restore-rpo-and-rto" } }]
      - eval_time: 65m
        alertname: BookingErrorBudgetFastBurn
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Bookings or payments are failing (2 % of the monthly error budget in one hour)", runbook: "RUNBOOKS.md#1-incident-response" } }]
      - eval_time: 1m
        alertname: WalletMismatch
        exp_alerts: []
      - eval_time: 30m
        alertname: ReplicationSlotRetainingWal
        exp_alerts: [{ exp_labels: { severity: ticket, slot: masslak_dw }, exp_annotations: { summary: "Replication slot masslak_dw holds back more than 5 GB of WAL (its reader is behind or stopped); at max_slot_wal_keep_size the primary drops it", runbook: "RUNBOOKS.md#21-data-warehouse-review-stage-d" } }]
      - eval_time: 20m
        alertname: ReplicationSlotInactive
        exp_alerts: []
      - eval_time: 45m
        alertname: ReplicationSlotInactive
        exp_alerts: [{ exp_labels: { severity: ticket, slot: masslak_dw }, exp_annotations: { summary: "Nothing has read replication slot masslak_dw for 30 minutes (warehouse or standby down)", runbook: "RUNBOOKS.md#21-data-warehouse-review-stage-d" } }]
      - eval_time: 7m
        alertname: ReplicationSlotForeignPlugin
        exp_alerts: [{ exp_labels: { severity: page, slot: peek }, exp_annotations: { summary: "Replication slot peek decodes with a plugin other than pgoutput: it can read every table, personal data included", runbook: "RUNBOOKS.md#21-data-warehouse-review-stage-d" } }]
      - eval_time: 8m
        alertname: TelemetryDown
        exp_alerts: []
      - eval_time: 12m
        alertname: TelemetryDown
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "The telemetry database does not answer: positions are refused (the apps keep and resend them) and their history waits", runbook: "RUNBOOKS.md#22-telemetry-database-review-stage-d" } }]
      - eval_time: 25m
        alertname: TelemetryPartitionMissing
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Today's or tomorrow's partition of the telemetry database is missing (worker upkeep not running)", runbook: "RUNBOOKS.md#22-telemetry-database-review-stage-d" } }]
      - eval_time: 14m
        alertname: NoFailoverCandidate
        exp_alerts: []
      - eval_time: 24m
        alertname: NoFailoverCandidate
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "No standby streams from the primary: a failure now would stop bookings until a restore", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" } }]
      - eval_time: 4m
        alertname: NoSynchronousStandby
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: masslak_refunds_waiting_provider
        values: "1x45"
      - series: 'masslak_payment_provider_circuit_open{provider="CARD",instance="api-1"}'
        values: "0x3 1x10 0x5"
      - series: masslak_approvals_oldest_pending_seconds
        values: "86000 86300 86500"
      - series: 'masslak_payment_unsigned_notices_last_hour{provider="CARD"}'
        values: "3 25"
    alert_rule_test:
      - eval_time: 20m
        alertname: RefundOutcomeUnknown
        exp_alerts: []
      - eval_time: 40m
        alertname: RefundOutcomeUnknown
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Refunds have waited over an hour for their provider to say whether it paid them; the amounts stay held", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - eval_time: 6m
        alertname: PaymentProviderCircuitOpen
        exp_alerts: []
      - eval_time: 10m
        alertname: PaymentProviderCircuitOpen
        exp_alerts:
          - exp_labels: { severity: page, provider: CARD }
            exp_annotations: { summary: "A payment provider has not answered for five minutes: payments and refunds through it are refused", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - eval_time: 1m
        alertname: ApprovalsWaiting
        exp_alerts: []
      - eval_time: 2m
        alertname: ApprovalsWaiting
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "A money decision has waited a day for its approval levels", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
      - eval_time: 0m
        alertname: UnsignedNoticesBurst
        exp_alerts: []
      - eval_time: 1m
        alertname: UnsignedNoticesBurst
        exp_alerts:
          - exp_labels: { severity: ticket, provider: CARD }
            exp_annotations: { summary: "Many provider notices with a bad signature in the last hour: someone may be probing the endpoint", runbook: "RUNBOOKS.md#25-money-boundaries-fees-and-approvals-148" }
  - interval: 1m
    input_series:
      - series: masslak_position_backlog_oldest_seconds
        values: "0 300 960"
      - series: 'masslak_mfa_codes_total{channel="SMS",outcome="failed",instance="api-1"}'
        values: "0 0 3 6 9 12"
    alert_rule_test:
      - eval_time: 1m
        alertname: PositionBacklogGrowing
        exp_alerts: []
      - eval_time: 2m
        alertname: PositionBacklogGrowing
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Vehicle positions have waited more than 15 minutes on the primary for the telemetry database", runbook: "RUNBOOKS.md#26-sign-in-boarding-and-positions-148" }
      - eval_time: 2m
        alertname: MfaCodesFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: MfaCodesFailing
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Sign-in codes by text or WhatsApp message are failing to leave: staff may be unable to sign in", runbook: "RUNBOOKS.md#26-sign-in-boarding-and-positions-148" }
  - interval: 1m
    input_series:
      - series: 'masslak_backup_last_success_age_seconds{copy="local"}'
        values: "3600 3660 3720"
      - series: 'masslak_backup_last_success_age_seconds{copy="offsite"}'
        values: "93000 93700 93760"
      - series: 'masslak_zero_data_loss_configured{instance="api-1"}'
        values: "1x15"
      - series: masslak_db_commits_wait_for_standby
        values: "0x11 1x4"
      - series: 'masslak_db_standbys{sync="sync"}'
        values: "1x12 0x3"
      - series: masslak_site_b_streaming
        values: "1 0x8"
      - series: masslak_site_b_in_recovery
        values: "1x9"
      - series: masslak_site_b_main_reachable
        values: "1 1 0x6"
    alert_rule_test:
      - eval_time: 2m
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 0m
        alertname: BackupOffsiteStale
        exp_alerts: []
      - eval_time: 1m
        alertname: BackupOffsiteStale
        exp_alerts:
          - exp_labels: { severity: page, copy: offsite }
            exp_annotations: { summary: "No backup copied off the server for more than 26 hours: losing this server would lose its backups too", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - eval_time: 9m
        alertname: ZeroDataLossNotEnforced
        exp_alerts: []
      - eval_time: 10m
        alertname: ZeroDataLossNotEnforced
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Zero data loss is on, but commits do not wait for a standby: run deploy/durability.sh", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - eval_time: 12m
        alertname: CommitsWaitingForStandby
        exp_alerts: []
      - eval_time: 14m
        alertname: CommitsWaitingForStandby
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Every commit waits for a standby and none is confirming: bookings and payments are paused", runbook: "RUNBOOKS.md#27-durability-and-backups-off-the-server-148" }
      - eval_time: 5m
        alertname: SiteBNotStreaming
        exp_alerts: []
      - eval_time: 6m
        alertname: SiteBNotStreaming
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "The second site receives no WAL from the main site", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
      - eval_time: 4m
        alertname: MainSiteUnreachableFromSiteB
        exp_alerts: []
      - eval_time: 5m
        alertname: MainSiteUnreachableFromSiteB
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "The second site cannot reach the main site's primary: decide whether the main site is lost (never automatic)", runbook: "RUNBOOKS.md#23-automatic-failover-and-the-second-site-review-stage-d" }
  # the assessment's addition 2: a vital metric that stops arriving raises MetricsMissing, naming it
  - interval: 1m
    input_series:
      - series: 'up{job="masslak-api"}'
        values: "1x30"
      - series: 'up{job="pgbouncer"}'
        values: "1x30"
      - series: 'up{job="node"}'
        values: "1x30"
      - series: 'masslak_db_up'
        values: "1x30"
      - series: 'masslak_db_connections'
        values: "1x30"
      - series: 'masslak_db_connections_max'
        values: "1x30"
      - series: 'masslak_db_lock_waiters'
        values: "1x30"
      - series: 'masslak_db_longest_transaction_seconds'
        values: "1x30"
      - series: 'masslak_db_idle_in_transaction'
        values: "1x30"
      - series: 'masslak_db_deadlocks_total'
        values: "1x30"
      - series: 'masslak_db_dead_tuples'
        values: "1x30"
      - series: 'masslak_db_vacuum_age_seconds'
        values: "1x30"
      - series: 'masslak_db_xid_age'
        values: "1x30"
      - series: 'masslak_db_in_recovery'
        values: "1x30"
      - series: 'masslak_db_standbys'
        values: "1x30"
      - series: 'masslak_db_commits_wait_for_standby'
        values: "1x30"
      - series: 'masslak_zero_data_loss_configured'
        values: "1x30"
      - series: 'masslak_db_archive_mode_on'
        values: "1x30"
      - series: 'masslak_db_wal_archive_last_success_age_seconds'
        values: "1x30"
      - series: 'masslak_db_wal_archive_failed_total'
        values: "1x30"
      - series: 'masslak_backup_last_success_age_seconds{copy="local"}'
        values: "1x30"
      - series: 'masslak_backup_last_success_age_seconds{copy="offsite"}'
        values: "1x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket'
