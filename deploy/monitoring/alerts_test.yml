# promtool test rules deploy/monitoring/alerts_test.yml  (audit T3-16: the alerts fire on the conditions they name)
rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: masslak_wallet_mismatches
        values: "0 0 2 2"
      - series: masslak_outbox_oldest_pending_seconds
        values: "10 400 400 400 400 400 400 400 400 400 400 400 400 400"
      - series: masslak_geo_partitions_missing
        values: "0x5 1x20"
      - series: masslak_db_archive_mode_on
        values: "1x20"
      - series: masslak_db_wal_archive_last_success_age_seconds
        values: "30 400 460 520 580 640 700 760 820 880"
      - series: 'masslak_http_requests_total{group="booking",status="2xx",method="POST",route="/api/bookings"}'
        values: "0+100x70"
      - series: 'masslak_http_requests_total{group="booking",status="5xx",method="POST",route="/api/bookings"}'
        values: "0+10x70"
      - series: masslak_outbox_partitioning_due
        values: "0x10 1x80"
      - series: 'masslak_db_function_calls_total{function="audit.tg_capture_change"}'
        values: "0+600x60"
      - series: 'masslak_db_function_seconds_total{function="audit.tg_capture_change"}'
        values: "0+1.2x60"
      - series: 'masslak_db_function_calls_total{function="sys.tg_set_updated_at"}'
        values: "0+600x60"
      - series: 'masslak_db_function_seconds_total{function="sys.tg_set_updated_at"}'
        values: "0+0.01x60"
      - series: masslak_wallet_rollup_lag_seconds
        values: "5x10 900x30"
      - series: masslak_ledger_open_days
        values: "1x10 3x400"
      - series: masslak_cash_overdue_minor
        values: "0x10 150000x90"
      - series: masslak_cash_near_limit_carriers
        values: "0x5 1x60"
      - series: masslak_release_hash_matches
        values: "1x10 0x20"
      - series: 'masslak_lock_wait_seconds_max{table="ops.seat_segment"}'
        values: "1 4 4 4 4 4 1"
      - series: 'masslak_lock_wait_seconds_max{table="fin.wallet"}'
        values: "4 1 4 1 4 1 4"
      - series: 'masslak_partition_ahead_seconds{table="sys.outbox_event",period="day"}'
        values: "604800x10 172800x60"
      - series: 'masslak_partition_ahead_seconds{table="fin.ledger_entry",period="month"}'
        values: "9000000x100"
      - series: 'masslak_partition_default_rows{table="fin.ledger_entry"}'
        values: "0x5 12x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket{le="0.25"}'
        values: "0+100x10 1000+10x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket{le="1"}'
        values: "0+100x10 1000+100x30"
      - series: 'masslak_db_pool_acquire_seconds_bucket{le="+Inf"}'
        values: "0+100x10 1000+100x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: CashOverdue
        exp_alerts: []
      - eval_time: 75m
        alertname: CashOverdue
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Carriers owe counter cash sold more than 30 days ago: chase the remittance or lower their cash limit", runbook: "RUNBOOKS.md#18-counter-cash-and-report-freshness-review-stage-b" } }]
      - eval_time: 4m
        alertname: LockWaitsOnTable
        exp_alerts: [{ exp_labels: { severity: ticket, table: ops.seat_segment }, exp_annotations: { summary: "Sessions keep waiting more than 3 s for locks on ops.seat_segment (the API gives up at 5 s)", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" } }]
      - eval_time: 45m
        alertname: PartitionsRunningOut
        exp_alerts: [{ exp_labels: { severity: ticket, table: sys.outbox_event, period: day }, exp_annotations: { summary: "Partitions of sys.outbox_event end soon: the daily upkeep has not created the next ones", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" } }]
      - eval_time: 25m
        alertname: RowsInDefaultPartition
        exp_alerts: [{ exp_labels: { severity: page, table: fin.ledger_entry }, exp_annotations: { summary: "Rows of fin.ledger_entry fell into its default partition: a partition is missing", runbook: "RUNBOOKS.md#19-release-supply-chain-and-finer-monitoring-review-stage-c" } }]
      - eval_time: 30m
        alertname: PoolWaits
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Requests wait more than 250 ms for a database connection (pool or PgBouncer too small, or slow transactions)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" } }]
      - eval_time: 8m
        alertname: PoolWaits
        exp_alerts: []
      - eval_time: 18m
        alertname: ReleaseRecordChanged
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "The record of applied schema files no longer matches the release manifest: the next upgrade will refuse to run", runbook: "RUNBOOKS.md#4-migrations-on-a-live-database" } }]
      - eval_time: 40m
        alertname: CashNearLimit
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "A carrier owes 90 % of its cash limit: its counter sales stop at the limit", runbook: "RUNBOOKS.md#18-counter-cash-and-report-freshness-review-stage-b" } }]
      - eval_time: 25m
        alertname: WalletRollupLagging
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Entries of shared wallets wait more than 5 minutes for the roll-up (worker down?); balances still count them, closing days waits", runbook: "RUNBOOKS.md#17-ten-million-operations-a-day" } }]
      - eval_time: 380m
        alertname: LedgerDaysNotClosing
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "Ledger days are not being closed (daily upkeep, a long transaction, or the roll-up behind)", runbook: "RUNBOOKS.md#17-ten-million-operations-a-day" } }]
      - eval_time: 75m
        alertname: OutboxPartitioningDue
        exp_alerts: [{ exp_labels: { severity: ticket }, exp_annotations: { summary: "The outbox passed capacity.outbox_partition_rows: partition it by day in the next release", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" } }]
      - eval_time: 50m
        alertname: TriggerCostOverBudget
        exp_alerts: [{ exp_labels: { severity: ticket, function: audit.tg_capture_change }, exp_annotations: { summary: "A trigger spends more than 1 ms per row (cost budget, STANDARDS.md)", runbook: "RUNBOOKS.md#10-load-and-capacity-r-12" } }]
      - eval_time: 3m
        alertname: WalletMismatch
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Wallet balances disagree with the ledger: freeze payouts", runbook: "RUNBOOKS.md#8-alerts-the-database-raises" } }]
      - eval_time: 12m
        alertname: OutboxBacklog
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Events wait more than 5 minutes in the outbox (worker down or stuck)", runbook: "RUNBOOKS.md#3-failover" } }]
      - eval_time: 25m
        alertname: PositionPartitionMissing
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Today's or tomorrow's position partition is missing (daily upkeep not running)", runbook: "RUNBOOKS.md#9-data-lifecycle-r-11" } }]
      - eval_time: 9m
        alertname: WalArchiveStale
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "No WAL archived for 5 minutes: point-in-time recovery is at risk (RPO)", runbook: "RUNBOOKS.md#2-backup-and-point-in-time-restore-rpo-and-rto" } }]
      - eval_time: 65m
        alertname: BookingErrorBudgetFastBurn
        exp_alerts: [{ exp_labels: { severity: page }, exp_annotations: { summary: "Bookings or payments are failing (2 % of the monthly error budget in one hour)", runbook: "RUNBOOKS.md#1-incident-response" } }]
      - eval_time: 1m
        alertname: WalletMismatch
        exp_alerts: []
