# Prometheus for Masslak (audit T3-16). Scrapes every API instance; the token is MASSLAK_METRICS_TOKEN of deploy/.env,
# mounted as a file. Alert rules: alerts.yml; SLOs: docs/operations/SLO.md.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: masslak-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["app:8000"]
  # PgBouncer's pools (staging overlay, service pgbouncer-exporter)
  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
  # the host (staging overlay, service node-exporter); the production profile has its own file, deploy/production/prometheus.yml
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
