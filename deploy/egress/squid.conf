# Egress proxy (audit T3-02): the only way out to the internet for the API and the worker.
# Tunnels HTTPS and mail submission to allowlisted domains; refuses private, loopback, link-local, metadata and other
# reserved addresses after its own DNS lookup, so a name that rebinds to an internal address is stopped here too.
http_port 3128

# Destinations that must never be reached, IPv4 and IPv6 (checked on the resolved address)
acl to_reserved dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl to_reserved dst 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl to_reserved dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8

# Allowed destinations: fixed providers (allowlist.txt) and the partner endpoints the worker writes (lists/generated.txt)
acl providers dstdomain "/etc/squid/allowlist.txt"
acl generated dstdomain "/etc/squid/lists/generated.txt"
acl tls_ports port 443 465 587
acl CONNECT method CONNECT

# Only the application containers may use the proxy
acl app_net src 172.31.0.0/24 127.0.0.1/32

http_access deny !app_net
http_access deny to_reserved
http_access deny !CONNECT
http_access deny !tls_ports
http_access allow CONNECT providers
http_access allow CONNECT generated
http_access deny all

# No caching, no identifying headers, a short DNS cache so the address checked is the address used
cache deny all
forwarded_for delete
via on
positive_dns_ttl 60 seconds
negative_dns_ttl 10 seconds
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid/squid.pid
