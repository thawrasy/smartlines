# Client authentication for the Masslak database containers (mounted read-only; postgres -c hba_file=...).
# The containers are reachable only on the internal network of docker-compose.yml.
# TYPE  DATABASE     USER        ADDRESS     METHOD
local   all          all                     trust
host    all          all         127.0.0.1/32 trust
host    all          all         ::1/128     trust
# the read replica streams WAL as the replication role (architecture review: reports never load the primary)
host    replication  replicator  all         scram-sha-256
# every other login, including the warehouse's masslak_cdc: its logical replication connections name the database and
# match here; a physical stream of the whole cluster matches only the line above, so only replicator may open one
host    all          all         all         scram-sha-256
