# pgBackRest repository for Masslak (audit T3-01). Backups and WAL are encrypted and kept in object storage outside the
# database server's account; the encryption passphrase comes from the key service, never from this file.
[global]
repo1-type=s3
repo1-s3-bucket=masslak-backups
repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
repo1-s3-region=eu-central-1
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass is set from the key service at deploy time (environment PGBACKREST_REPO1_CIPHER_PASS)
repo1-retention-full=5
repo1-retention-diff=7
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=4
compress-type=zst
start-fast=y
log-level-console=info

[masslak]
pg1-path=/var/lib/postgresql/16/main
pg1-port=5432

# Schedule (cron on the backup host):
#   full backup weekly:         pgbackrest --stanza=masslak --type=full backup
#   differential backup daily:  pgbackrest --stanza=masslak --type=diff backup
#   check archiving hourly:     pgbackrest --stanza=masslak check
# Restore to a point in time (into a new server, never over the primary):
#   pgbackrest --stanza=masslak --type=time --target="2027-03-29 10:15:00+03" --target-action=promote restore
