# Production WAL archiving for point-in-time recovery (audit T3-01; docs/operations/RUNBOOKS.md, section 2).
# Include from postgresql.conf (include_if_exists = 'postgresql.pitr.conf') on the primary and the standby.
wal_level = replica
archive_mode = on
# pgBackRest pushes each completed WAL segment to the repository, asynchronously (see pgbackrest.conf)
archive_command = 'pgbackrest --stanza=masslak archive-push %p'
# A segment is closed and archived at least every minute even when traffic is low: RPO of 60 s if the server is lost
archive_timeout = 60
# Streaming standby for failover (Patroni manages primary_conninfo and promotion)
max_wal_senders = 10
wal_keep_size = 2GB
hot_standby = on
# Page checksums are set at initdb (--data-checksums); this logs corruption and full-page writes keep PITR consistent
full_page_writes = on
wal_compression = on
