# /etc/fail2ban/filter.d/bankfas-caddy.conf: a refused request (401, 403, 429) in Caddy's JSON access log, keyed on
# the client address Caddy saw. Test with `fail2ban-regex /var/log/caddy/access.log bankfas-caddy`.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":(?:401|403|429)\b
ignoreregex =
datepattern = "ts":{EPOCH}
