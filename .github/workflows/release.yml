# Release (expert review of October 2026, stage C6): a tag v* builds the server archive from the tagged commit, with
# its software bill of materials, checksums and keyless Sigstore signatures, and publishes them as a GitHub release.
# A server verifies an archive with deploy/verify-release.sh before extracting it (docs/operations/RUNBOOKS.md).
# The images are built here too, once (reviews of October 2026, H-08): the API, the egress proxy and the production
# database, pushed to ghcr.io, each digest signed keylessly with its bill of materials and its build provenance. The
# archive records their digests in IMAGES, so a production server runs exactly these (deploy/images.sh pull).
# Nothing is published unless every CI job passes on the tagged commit first (review of 1.47.0, R-49).
#
# Three ways start it, all on a v* tag, so the signatures name release.yml@refs/tags/v... either way:
# - the tag pushed with git: the workflow creates the release;
# - a release published from the GitHub page with a new tag: the workflow adds the signed files to that release;
# - "Run workflow" in the Actions tab with the tag chosen as the ref, if neither of the above started it.
# GitHub runs the workflow file of the tagged commit, so the tag must point at a commit that carries this version.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A release published from the page can start both a tag push and a release run; the later one replaces the earlier,
# and the publishing step below gives the same result whichever finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI on the tagged commit
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  images:
    name: Images built once, pushed and signed
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # pushes to ghcr.io
      id-token: write      # the keyless signatures name this workflow and tag (Sigstore)
      attestations: write  # the build provenance
    outputs:
      images: ${{ steps.build.outputs.images }}
      masslak: ${{ steps.build.outputs.masslak }}
      egress: ${{ steps.build.outputs.egress }}
      db: ${{ steps.build.outputs.db }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: Build each image once and push it to ghcr.io
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ./deploy/images.sh build "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_REF_NAME" "$GITHUB_SHA" IMAGES
          { echo "images<<IMAGES_EOF"; cat IMAGES; echo IMAGES_EOF; } >> "$GITHUB_OUTPUT"
          for n in masslak masslak-egress masslak-db; do
            key="${n#masslak-}"; [ "$n" = masslak ] && key=masslak
            echo "$key=$(sed -n "s/^$n=.*@//p" IMAGES)" >> "$GITHUB_OUTPUT"
          done
      - name: Sign each digest and attest its bill of materials (keyless)
        run: PATH="$(dirname "${{ steps.syft.outputs.cmd }}"):$PATH" ./deploy/images.sh sign IMAGES
      - name: Build provenance of the API image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/masslak
          subject-digest: ${{ steps.build.outputs.masslak }}
          push-to-registry: true
      - name: Build provenance of the egress proxy image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/masslak-egress
          subject-digest: ${{ steps.build.outputs.egress }}
          push-to-registry: true
      - name: Build provenance of the production database image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/masslak-db
          subject-digest: ${{ steps.build.outputs.db }}
          push-to-registry: true

  release:
    name: Signed release archive
    needs: [ci, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creates the GitHub release
      id-token: write      # the keyless signature names this workflow and tag (Sigstore)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Archive of the tagged commit, with the commit and the signed images recorded inside (1058, H-08)
        env:
          IMAGES: ${{ needs.images.outputs.images }}
        run: |
          name="masslak-$GITHUB_REF_NAME"
          mkdir dist
          git archive --format=tar --prefix="$name/" -o "dist/$name.tar" "$GITHUB_SHA"
          printf 'commit=%s\nversion=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/RELEASE"
          printf '%s\n' "$IMAGES" > "$RUNNER_TEMP/IMAGES"
          grep -q "^commit=$GITHUB_SHA$" "$RUNNER_TEMP/IMAGES"
          tar --append -f "dist/$name.tar" -C "$RUNNER_TEMP" --transform "s#^#$name/#" RELEASE IMAGES
          gzip -n "dist/$name.tar"
          cp "$RUNNER_TEMP/IMAGES" "dist/$name.IMAGES"
      - name: Software bill of materials of the source (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/masslak-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums and keyless signatures
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz ./*.spdx.json ./*.IMAGES | sed 's# \./# #' > SHA256SUMS
          for f in ./*.tar.gz ./*.spdx.json ./*.IMAGES SHA256SUMS; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - name: Publish the release, or add the signed files to the one published from the GitHub page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="Verify before installing: deploy/verify-release.sh masslak-$tag.tar.gz (docs/operations/RUNBOOKS.md, section 19)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            body="$(gh release view "$tag" --json body --jq .body)"
            case "$body" in
              *verify-release.sh*) ;;
              "") gh release edit "$tag" --notes "$notes" ;;
              *) gh release edit "$tag" --notes "$(printf '%s\n\n%s' "$body" "$notes")" ;;
            esac
            [ -n "$(gh release view "$tag" --json name --jq .name)" ] || gh release edit "$tag" --title "Masslak $tag"
          else
            gh release create "$tag" dist/* --verify-tag --title "Masslak $tag" --notes "$notes"
          fi
