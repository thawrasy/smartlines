# Continuous integration: every push and pull request runs the schema tests, the API end-to-end tests against a
# real PostgreSQL with row-level security, the web build, the security scans and the language policy.
name: CI

on:
  push:
    branches: ["**"]     # a tag runs these same jobs through the release workflow, before anything is published
  pull_request:
  workflow_call:         # .github/workflows/release.yml (review of 1.47.0, R-49)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build a fresh database and run the checks
        run: db/tests/run.sh -h localhost -U postgres
      - name: Upgrading an existing database applies nothing twice
        run: |
          createdb -h localhost -U postgres upgrade_check
          db/build.sh upgrade_check -h localhost -U postgres > /dev/null
          db/upgrade.sh upgrade_check -h localhost -U postgres | tee upgrade.log
          ! grep -q '^>>' upgrade.log
      - name: An applied schema file that changed stops the upgrade before anything is applied (review stage A5)
        run: |
          echo '-- edited after release' >> db/schema/1056_payment_options.sql
          set +e; db/upgrade.sh upgrade_check -h localhost -U postgres 2> drift.log; rc=$?; set -e
          cat drift.log
          test "$rc" = 3 && grep -q '1056_payment_options.sql' drift.log
          MASSLAK_SCHEMA_DRIFT=warn db/upgrade.sh upgrade_check -h localhost -U postgres
          git checkout -- db/schema/1056_payment_options.sql
      - name: The drift override is refused on a production database (reviews of October 2026, M-07)
        run: |
          psql -h localhost -U postgres -d upgrade_check -qc "INSERT INTO sys.setting (key, value, description) VALUES ('deploy.environment', to_jsonb('production'::text), 'CI') ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value"
          set +e; MASSLAK_SCHEMA_DRIFT=warn db/upgrade.sh upgrade_check -h localhost -U postgres 2> m07.log; rc=$?; set -e
          cat m07.log
          test "$rc" = 5 && grep -q 'not allowed on a production server' m07.log
          psql -h localhost -U postgres -d upgrade_check -qc "DELETE FROM sys.setting WHERE key = 'deploy.environment'"
      - name: A constraint left NOT VALID is validated by the next upgrade (reviews of October 2026, H-09)
        run: |
          psql -h localhost -U postgres -d upgrade_check -qc "ALTER TABLE ref.market ADD CONSTRAINT zz_ci_probe CHECK (true) NOT VALID"
          test "$(psql -h localhost -U postgres -d upgrade_check -Atc "SELECT count(*) FROM sys.unvalidated_constraints()")" = 1
          db/upgrade.sh upgrade_check -h localhost -U postgres
          test "$(psql -h localhost -U postgres -d upgrade_check -Atc "SELECT count(*) FROM sys.unvalidated_constraints()")" = 0
          psql -h localhost -U postgres -d upgrade_check -qc "ALTER TABLE ref.market DROP CONSTRAINT zz_ci_probe"
      - name: A record of applied files changed by hand stops the upgrade (release manifest, review stage C3)
        run: |
          psql -h localhost -U postgres -d upgrade_check -qc "DELETE FROM sys.schema_file WHERE file = '1056_payment_options.sql'"
          set +e; db/upgrade.sh upgrade_check -h localhost -U postgres 2> manifest.log; rc=$?; set -e
          cat manifest.log
          test "$rc" = 4 && grep -q 'release manifest' manifest.log
          test "$(psql -h localhost -U postgres -d upgrade_check -Atc "SELECT count(*) FROM sys.schema_file WHERE file = '1056_payment_options.sql'")" = 0
          psql -h localhost -U postgres -d upgrade_check -qc "INSERT INTO sys.schema_file (file, sha256) VALUES ('1056_payment_options.sql', '$(sha256sum db/schema/1056_payment_options.sql | cut -d' ' -f1)')"
          db/upgrade.sh upgrade_check -h localhost -U postgres
      - name: Data dictionary, ERD and README figures match the built database (review stage A8)
        run: python3 db/tools/gen_docs.py --check upgrade_check -h localhost -U postgres
      - name: No new two-way module dependency or table cycle without a recorded reason
        run: python3 db/tools/schema_dependencies.py upgrade_check -h localhost -U postgres

  warehouse:
    # Review stage D3: a primary with logical WAL streams facts and dimensions to a separate warehouse, without
    # personal data. The warehouse shares the runner's network, so both sides reach the primary at localhost:5433.
    name: Data warehouse (change data capture)
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: postgres
      MASSLAK_OWNER_URL: postgresql://postgres:postgres@localhost:5433/masslak
      MASSLAK_DW_SOURCE: host=localhost port=5433 dbname=masslak user=masslak_cdc password=ci-cdc-password
      MASSLAK_DW_URL: postgresql://postgres:postgres@localhost:5434/masslak_dw
      MASSLAK_DW_ANALYST_PASSWORD: ci-analyst-password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements*" }
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: A primary with logical WAL and a warehouse server
        run: |
          IMAGE=postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          docker run -d --name primary -p 5433:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=masslak "$IMAGE" \
            -c wal_level=logical -c max_slot_wal_keep_size=1GB
          docker run -d --name warehouse --network host -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=masslak_dw "$IMAGE" -c port=5434
          for p in 5433 5434; do for i in $(seq 1 60); do pg_isready -q -h localhost -p $p -U postgres && break; sleep 1; done; done
          sleep 3   # the image's first start restarts the server once after its init scripts
          for p in 5433 5434; do for i in $(seq 1 60); do pg_isready -q -h localhost -p $p -U postgres && break; sleep 1; done; done
      - name: Schema, login roles (with the warehouse login) and demo data on the primary
        run: |
          db/build.sh masslak -h localhost -p 5433 -U postgres > /dev/null
          psql -h localhost -p 5433 -U postgres -d masslak -v ON_ERROR_STOP=1 -q -v api_password=ci-api-password \
               -v audit_password=ci-audit-password -v cdc_password=ci-cdc-password -f db/create_login_roles.sql
          python backend/scripts/seed_demo.py > /dev/null
          python backend/scripts/seed_modules.py > /dev/null
      - name: Subscribe and copy every published table
        run: python3 db/warehouse/build.py --wait --timeout 300
      - name: Changes stream within seconds, counts match, and the warehouse holds no unpublished column
        run: |
          psql -h localhost -p 5433 -U postgres -d masslak -qc "UPDATE ref.market SET locale = 'en' WHERE country_code = 'JO'"
          for i in $(seq 1 30); do
            [ "$(psql -h localhost -p 5434 -U postgres -d masslak_dw -Atc "SELECT locale FROM ref.market WHERE country_code = 'JO'")" = en ] && break
            sleep 1
          done
          test "$(psql -h localhost -p 5434 -U postgres -d masslak_dw -Atc "SELECT locale FROM ref.market WHERE country_code = 'JO'")" = en
          python3 db/warehouse/build.py --check
      - name: Analysts read the dw views and cannot reach the primary's data
        run: |
          PGPASSWORD=ci-analyst-password psql -h localhost -p 5434 -U dw_analyst -d masslak_dw -v ON_ERROR_STOP=1 \
            -c "SELECT sum(bookings) FROM dw.sales_daily" -c "SELECT count(*) FROM dw.trip_load" -c "SELECT count(*) FROM dw.ledger_daily"
          ! PGPASSWORD=ci-cdc-password psql -h localhost -p 5433 -U masslak_cdc -d masslak -c "SELECT email FROM iam.app_user LIMIT 1"
          ! PGPASSWORD=ci-cdc-password psql -h localhost -p 5433 -U masslak_cdc -d masslak -c "SELECT contact_mobile FROM sales.booking LIMIT 1"
      - name: The warehouse copies everything again after the primary dropped its slot
        run: python3 db/warehouse/build.py --resync --wait --timeout 300 && python3 db/warehouse/build.py --check
      - name: Server logs on failure
        if: failure()
        run: docker logs primary 2>&1 | tail -80; docker logs warehouse 2>&1 | tail -80

  api:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: masslak }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      MASSLAK_DATABASE_URL: postgresql://masslak_api:ci-api-password@localhost:5432/masslak
      MASSLAK_AUDIT_DATABASE_URL: postgresql://masslak_audit:ci-audit-password@localhost:5432/masslak
      MASSLAK_OWNER_URL: postgresql://postgres:postgres@localhost:5432/masslak
      MASSLAK_SANDBOX: "true"
      MASSLAK_COOKIE_SECURE: "false"
      MASSLAK_SIGNING_SECRET: ci-signing-secret-not-for-production-use
      MASSLAK_RATE_AUTH_PER_MINUTE: "600"
      MASSLAK_RATE_AUTH_IP_PER_MINUTE: "6000"
      # the whole suite runs from one address faster than any real client; production keeps the defaults (240 / 1200)
      MASSLAK_RATE_PUBLIC_PER_MINUTE: "20000"
      MASSLAK_RATE_API_PER_MINUTE: "20000"
      MASSLAK_TEST_URL: http://localhost:8077
      MASSLAK_METRICS_TOKEN: ci-metrics-token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements*" }
      - run: pip install --require-hashes -r backend/requirements.lock && pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the web interface the API serves (checked in the browser below)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Schema, login roles (with the key that signs request contexts, 1080) and demo data
        run: |
          db/build.sh masslak -h localhost -U postgres > /dev/null
          psql -h localhost -U postgres -d masslak -v ON_ERROR_STOP=1 -q -v api_password=ci-api-password \
               -v audit_password=ci-audit-password -v context_key="$(cd backend && python -m app.tools.context_key)" \
               -f db/create_login_roles.sql
          python backend/scripts/seed_demo.py
          python backend/scripts/seed_modules.py
      - name: Start the API (under coverage, R-52)
        working-directory: backend
        run: |
          nohup python -m coverage run -m uvicorn app.main:app --port 8077 --timeout-keep-alive 75 > ../api.log 2>&1 &
          echo $! > ../api.pid
          for i in $(seq 1 60); do curl -sf localhost:8077/api/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Unit and end-to-end tests
        working-directory: backend
        run: python -m coverage run -m pytest tests -q
      - name: Accessibility and right-to-left layout of the web interface, English and Arabic, phone and desktop (code review 6.2)
        working-directory: frontend
        env: { MASSLAK_UI_BASE: "http://localhost:8077", CHROME: /usr/bin/google-chrome }
        run: npm run ui-checks
      - name: Positions in a telemetry database (review stage D2), through a second API configured for it
        working-directory: backend
        env:
          MASSLAK_TELEMETRY_TEST_URL: postgresql://masslak_tel:ci-tel-password@localhost:5432/masslak_tel
          MASSLAK_TELEMETRY_UPKEEP_TEST_URL: postgresql://masslak_tel_upkeep:ci-tel-upkeep-password@localhost:5432/masslak_tel
          MASSLAK_TELEMETRY_OWNER_TEST_URL: postgresql://postgres:postgres@localhost:5432/masslak_tel
        run: |
          psql -h localhost -U postgres -d postgres -qc "CREATE DATABASE masslak_tel"
          psql -h localhost -U postgres -d masslak_tel -v ON_ERROR_STOP=1 -q -v writer_password=ci-tel-password \
               -v upkeep_password=ci-tel-upkeep-password -f ../db/telemetry/schema.sql > /dev/null
          MASSLAK_TELEMETRY_DATABASE_URL="$MASSLAK_TELEMETRY_TEST_URL" nohup python -m uvicorn app.main:app --port 8078 --timeout-keep-alive 75 > ../api_tel.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8078/api/health > /dev/null && break; sleep 1; done
          MASSLAK_TEST_URL=http://localhost:8078 python -m pytest tests/test_telemetry.py -q
      - name: Files in an S3-compatible object store with server-side encryption (code review 3.2), through a third API
        working-directory: backend
        env:
          MASSLAK_FILES_S3_ENDPOINT: http://127.0.0.1:8333
          MASSLAK_FILES_S3_BUCKET: masslak-files
          MASSLAK_FILES_S3_ACCESS_KEY: masslak-files
          MASSLAK_FILES_S3_SECRET_KEY: ci-files-secret-not-for-production
          MASSLAK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          MASSLAK_TEST_S3_SECRET_KEY: ci-files-secret-not-for-production
        run: |
          # SeaweedFS stands for the object store: one identity, one bucket, SSE-S3 confirmed on every write
          printf '%s' '{"identities":[{"name":"masslak","credentials":[{"accessKey":"masslak-files","secretKey":"ci-files-secret-not-for-production"}],"actions":["Read","Write","List","Tagging","Admin"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/etc/s3.json:ro \
            chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            mini -dir=/data -s3.config=/etc/s3.json -bucket=masslak-files
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333 && break; sleep 1; done
          python -m app.tools.files_move copy          # the files the first API wrote on its volume
          MASSLAK_FILES_BACKEND=s3 nohup python -m uvicorn app.main:app --port 8079 --timeout-keep-alive 75 > ../api_s3.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8079/api/health > /dev/null && break; sleep 1; done
          MASSLAK_FILES_BACKEND=s3 MASSLAK_TEST_URL=http://localhost:8079 python -m pytest tests/test_documents.py tests/test_file_store.py -q
          python -m app.tools.files_move verify        # every file the database refers to is in the store, unchanged
          # the store down: the API answers busy and serves the file again once the store is back
          docker stop s3
          cd tests
          MASSLAK_TEST_URL=http://localhost:8079 python - <<'EOF'
          from test_e2e import login
          c = login("owner@carrier.test", "OPERATOR")
          doc = c.get("/api/company/documents").json()["documents"][0]["uid"]
          r = c.get(f"/api/company/documents/{doc}/file")
          assert r.status_code == 503 and r.headers["retry-after"] and "file store" in r.json()["error"]["message"], r.text
          EOF
          docker start s3
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333 && break; sleep 1; done
          MASSLAK_TEST_URL=http://localhost:8079 python - <<'EOF'
          import time
          from test_e2e import login
          c = login("owner@carrier.test", "OPERATOR")
          doc = c.get("/api/company/documents").json()["documents"][0]["uid"]
          for _ in range(30):
              if c.get(f"/api/company/documents/{doc}/file").status_code == 200:
                  break
              time.sleep(1)
          else:
              raise SystemExit("the file did not come back with the store")
          EOF
      - name: Test coverage of the API and the tests, held to its minimums (R-52)
        working-directory: backend
        run: |
          kill -TERM "$(cat ../api.pid)"
          for i in $(seq 1 30); do kill -0 "$(cat ../api.pid)" 2>/dev/null || break; sleep 1; done
          python -m coverage combine
          python -m coverage report --sort=cover | tail -60
          python -m coverage json -q -o coverage.json
          python scripts/coverage_gate.py > gate.txt; rc=$?
          cat gate.txt
          { echo "### Test coverage (R-52)"; echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: API log on failure
        if: failure()
        run: tail -200 api.log; tail -100 api_tel.log 2>/dev/null || true; tail -100 api_s3.log 2>/dev/null || true

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile apps
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Core unit tests (session, ticket credentials, offline boarding)
        run: npm test
      - name: Bundle both variants (Metro resolves every import)
        env: { CI: "1", EXPO_OFFLINE: "1" }
        run: |
          npx expo export --platform android --output-dir /tmp/passenger
          APP_VARIANT=driver npx expo export --clear --platform ios --output-dir /tmp/driver
          APP_VARIANT=operator npx expo export --clear --platform android --output-dir /tmp/operator
      - name: Known vulnerabilities in app dependencies
        run: npm audit --omit=dev --audit-level=critical

  stack:
    name: Deployment stack (compose, HTTPS, backup and restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: One-command installation (secrets, build, start, first administrator)
        run: |
          sudo ./deploy/install.sh --domain localhost --admin-email admin@install.test --demo --skip-server-setup
          # the steps below run docker compose as the runner, which reads the per-container files (deploy/env-split.sh)
          sudo chown -R "$USER" deploy/.env deploy/FIRST_LOGIN.txt deploy/env
          sed -i "s|^MASSLAK_BACKUP_DIR=.*|MASSLAK_BACKUP_DIR=$RUNNER_TEMP/backups|" deploy/.env
      - name: The first administrator signs in with the generated password
        run: |
          pw="$(sed -n 's/^Password: *//p' deploy/FIRST_LOGIN.txt)"
          test "$(stat -c %a deploy/FIRST_LOGIN.txt)" = 600
          curl -fsSk -H 'X-Masslak-Client: web' -H 'Content-Type: application/json' \
               -d "{\"identifier\":\"admin@install.test\",\"password\":\"$pw\",\"portal\":\"PLATFORM\"}" https://localhost/api/auth/login | grep -q '"mfa":"ENROLL"'
      - name: Site answers over HTTPS through Caddy
        run: |
          for i in $(seq 60); do curl -fsSk https://localhost/api/health && break; sleep 3; done
          curl -fsSk https://localhost/api/health
          curl -fsSk https://localhost/api/ready | grep -q '"ready":true'
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308       # plain HTTP redirects
          curl -sSkI https://localhost/ | grep -qi '^strict-transport-security'
      - name: Sign in and search (demo data)
        run: |
          curl -fsSk -c jar -H 'X-Masslak-Client: web' -H 'Content-Type: application/json' \
               -d '{"identifier":"passenger@masslak.test","password":"Masslak-Demo-2026","portal":"PASSENGER"}' https://localhost/api/auth/login
          curl -fsSk -b jar -H 'X-Masslak-Client: web' https://localhost/api/auth/me | grep -q passenger@masslak.test
          curl -fsSk "https://localhost/api/trips/search?origin=DAM&destination=ALP&on=$(TZ=Asia/Damascus date -d tomorrow +%F)" | grep -q '"trips"'
          curl -fsSk https://localhost/api/public/keys/ticket | grep -q public_key
      - name: Reports read the streaming replica (architecture review)
        run: |
          dc="docker compose --env-file deploy/.env"
          test "$($dc exec -T db-replica psql -U postgres -Atc 'SELECT pg_is_in_recovery()')" = t
          test "$($dc exec -T db psql -U postgres -Atc "SELECT count(*) FROM pg_stat_replication WHERE state = 'streaming'")" = 1
          $dc exec -T app printenv MASSLAK_REPORTS_DATABASE_URL | grep -q '@db-replica:'
      - name: The API and the worker reach the database through PgBouncer in transaction mode (capacity model)
        run: |
          dc="docker compose --env-file deploy/.env"
          $dc exec -T app printenv MASSLAK_DATABASE_URL | grep -q '@pgbouncer:6432/'
          $dc exec -T worker printenv MASSLAK_DATABASE_URL | grep -q '@pgbouncer:6432/'
          test "$($dc exec -T db psql -U postgres -Atc "SELECT count(*) FROM pg_stat_activity WHERE usename = 'masslak_api' AND client_addr IS NOT NULL")" -ge 1
      - name: Only Caddy is reachable from outside
        run: |
          for port in 5432 8000; do
            if timeout 3 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then echo "port $port is exposed"; exit 1; fi
          done
      - name: Egress (T3-02) - the worker has no route out, the proxy refuses internal and unlisted targets
        run: |
          dc="docker compose --env-file deploy/.env"
          if $dc exec -T worker python -c "import socket; socket.create_connection(('1.1.1.1', 443), 5)" 2>/dev/null; then
            echo "the worker reached the internet without the proxy"; exit 1; fi
          if $dc exec -T app python -c "import socket; socket.create_connection(('1.1.1.1', 443), 5)" 2>/dev/null; then
            echo "the API reached the internet without the proxy"; exit 1; fi
          $dc exec -T worker bash /app/deploy/egress/selftest.sh egress:3128
      - name: Backup, copy off the server, restore, and the site still works
        run: |
          # the off-site copy (review of 1.47.0, R-41): rclone to another place, checked, recorded in the database
          sudo apt-get install -y -qq rclone > /dev/null
          echo "MASSLAK_BACKUP_OFFSITE=$RUNNER_TEMP/offsite" >> deploy/.env
          ./deploy/backup.sh
          backup="$(ls -d $RUNNER_TEMP/backups/*/ | tail -1)"
          (cd "$RUNNER_TEMP/offsite/$(basename "$backup")" && sha256sum -c --quiet SHA256SUMS)
          docker compose --env-file deploy/.env exec -T db psql -U postgres -d masslak -Atc \
            "SELECT string_agg(copy || ':' || ok, ' ' ORDER BY id) FROM sys.backup_run" | grep -q 'LOCAL:true OFFSITE:true'
          # the restore ends by reading back every stored file the restored database refers to (R-44)
          ./deploy/restore.sh "$backup" --yes
          for i in $(seq 60); do curl -fsSk https://localhost/api/health && break; sleep 3; done
          curl -fsSk -H 'X-Masslak-Client: web' -H 'Content-Type: application/json' \
               -d '{"identifier":"passenger@masslak.test","password":"Masslak-Demo-2026","portal":"PASSENGER"}' https://localhost/api/auth/login
      - name: Images are tagged by commit and a rollback restarts the previous ones (code review H-07)
        run: |
          tag="$(sed -n 's/^MASSLAK_IMAGE_TAG=//p' deploy/.env)"
          test "$tag" = "$(git rev-parse HEAD | cut -c1-12)"
          test "$(docker inspect --format '{{.Config.Image}}' "$(docker compose --env-file deploy/.env ps -q app)")" = "masslak:$tag"
          # stand-in for the release before this one: the same image under another tag
          docker tag "masslak:$tag" masslak:ci-previous
          echo "MASSLAK_PREVIOUS_IMAGE_TAG=ci-previous" | sudo tee -a deploy/.env >/dev/null
          sudo ./deploy/update.sh --rollback
          test "$(docker inspect --format '{{.Config.Image}}' "$(docker compose --env-file deploy/.env ps -q app)")" = masslak:ci-previous
          test "$(sed -n 's/^MASSLAK_IMAGE_TAG=//p' deploy/.env)" = ci-previous
          test "$(sed -n 's/^MASSLAK_PREVIOUS_IMAGE_TAG=//p' deploy/.env)" = "$tag"
          curl -fsSk https://localhost/api/ready
          # the partners' document stays published whatever the API docs setting
          curl -fsSk https://localhost/api/v1/openapi.json >/dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env logs --tail 200

  production:
    # Review of 1.47.0, R-48, and the reviews of October 2026, package 2: a production server installs only in the
    # production profile (deploy/production). This job refuses an incomplete setup, then installs as a production
    # server would, against stand-ins for what lies outside the server (the key service, object storage for WAL, the
    # alert receivers: deploy/production/ci/stand-ins.yml), and checks the profile on the running stack.
    name: Production installation (production profile, key service, TLS, archiving)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: Tools a production server has (age, rclone, cosign; syft stands for the release workflow's)
        run: |
          sudo apt-get install -y -qq age rclone > /dev/null
          sudo install "$(command -v cosign)" /usr/local/bin/cosign
          sudo install "${{ steps.syft.outputs.cmd }}" /usr/local/bin/syft
      - name: An incomplete production setup is refused before anything is built
        run: |
          sudo ./deploy/init-env.sh --domain localhost --email ops@install.test
          ! sudo grep -Eq '^MASSLAK_(FIELD_KEYS|BIDX_KEY)=.' deploy/.env      # made and kept wrapped by the key service
          set +e; sudo ./deploy/install.sh --domain localhost --admin-email admin@install.test --skip-server-setup 2> refused.log; rc=$?; set -e
          cat refused.log
          test "$rc" != 0 && grep -q 'MASSLAK_KMS_PROVIDER=vault is required' refused.log && grep -q 'PGBACKREST_REPO1_TYPE' refused.log
          test -z "$(sudo docker ps -q)"
      - name: Stand-ins for the key service, object storage, the alert receivers and the release workflow (CI only)
        run: sudo ./deploy/production/ci/setup.sh
      - name: Installation in the production profile, from the signed images (H-08)
        run: |
          sudo ./deploy/install.sh --domain localhost --admin-email admin@install.test --skip-server-setup | tee install.log
          test "${PIPESTATUS[0]}" = 0
          grep -q 'verified masslak-db' install.log && ! grep -q 'Building and starting' install.log    # pulled, never built
          sudo chown "$USER" deploy/.env deploy/FIRST_LOGIN.txt IMAGES
          grep -q '^MASSLAK_SANDBOX=false$' deploy/.env && grep -q '^MASSLAK_ENVIRONMENT=production$' deploy/.env
          curl -fsSk https://localhost/api/ready | tee ready.json | grep -q '"ready":true'
          sudo docker compose --env-file deploy/.env logs migrate | grep -q 'production preflight passed'
      - name: TLS only, certificates checked, the warehouse login by certificate from its address (H-05, H-10)
        run: |
          dc="sudo docker compose --env-file deploy/.env"
          q() { $dc exec -T db psql -U postgres -d masslak -Atc "$1"; }
          # every network connection to the database is encrypted, the API's through PgBouncer and directly
          test "$(q "SELECT count(*) FROM pg_stat_ssl s JOIN pg_stat_activity a USING (pid) WHERE a.client_addr IS NOT NULL AND NOT s.ssl")" = 0
          test "$(q "SELECT count(*) FROM pg_stat_ssl s JOIN pg_stat_activity a USING (pid) WHERE a.usename = 'masslak_api' AND s.ssl")" -ge 1
          test "$(q "SELECT count(*) FROM pg_stat_replication r JOIN pg_stat_ssl s USING (pid) WHERE s.ssl AND r.application_name = 'replica1'")" = 1
          # without TLS, or as the warehouse from anywhere but its address, the database refuses before any password
          psql_in() { $dc run --rm --no-deps -T -e PGPASSWORD=x --entrypoint psql migrate "$@" -c "SELECT 1"; }
          if psql_in "host=db dbname=masslak user=postgres sslmode=disable" 2> plain.log; then exit 1; fi
          grep -q 'no encryption' plain.log
          if psql_in "host=db dbname=masslak user=masslak_cdc sslmode=verify-full sslrootcert=/etc/masslak/trust/ca.crt" 2> cdc.log; then exit 1; fi
          grep -q 'pg_hba.conf rejects connection' cdc.log
          # a client that does not check the certificate's name is refused by its own check
          db_ip="$($dc run --rm --no-deps -T --entrypoint getent migrate hosts db | awk '{print $1; exit}')"
          if psql_in "host=$db_ip dbname=masslak user=postgres sslmode=verify-full sslrootcert=/etc/masslak/trust/ca.crt" 2> name.log; then exit 1; fi
          grep -q 'does not match host name' name.log
          # no decoding plugin but pgoutput (H-10)
          if q "SELECT pg_create_logical_replication_slot('zz_probe', 'test_decoding')" 2> plugin.log; then exit 1; fi
          grep -q 'test_decoding' plugin.log
      - name: WAL archived off the host, proven before the migration; a full backup into the repository (H-02)
        run: |
          dc="sudo docker compose --env-file deploy/.env"
          sudo ./deploy/pitr/check-archive.sh
          $dc exec -T -u postgres db pgbackrest --stanza=masslak --type=full backup
          $dc exec -T -u postgres db pgbackrest --stanza=masslak info | tee pgbackrest.info
          grep -q 'full backup' pgbackrest.info && grep -q 'cipher: aes-256-cbc' pgbackrest.info
      - name: Data keys wrapped by the key service; the API holds no key and no owner secret (H-06)
        run: |
          dc="sudo docker compose --env-file deploy/.env"
          test "$($dc exec -T db psql -U postgres -d masslak -Atc "SELECT count(*) FROM sec.key_registry WHERE purpose IN ('FIELD_ENCRYPTION', 'WEBHOOK_SECRET', 'BLIND_INDEX') AND status = 'ACTIVE' AND (wrapped_dek IS NULL OR kms_key_id <> 'masslak-field')")" = 0
          if $dc exec -T app env | grep -E '^(POSTGRES_PASSWORD|MASSLAK_FIELD_KEYS|MASSLAK_BIDX_KEY|MASSLAK_REPLICATION_PASSWORD|PGBACKREST_[A-Z_]*)='; then exit 1; fi
          # an API started with an owner secret, a raw key, or a connection that does not check certificates refuses to start
          for e in POSTGRES_PASSWORD=x MASSLAK_FIELD_KEYS=kms://x=AAAA "MASSLAK_DATABASE_URL=postgresql://masslak_api:x@pgbouncer:6432/masslak"; do
            if $dc run --rm --no-deps -T -e "$e" app python -c "from app import profile; profile.require_in_production()"; then
              echo "started with $e"; exit 1; fi
          done
          # the proxy lets through the key service at exactly its address and port, and still nothing else internal
          $dc exec -T egress cat /etc/squid/keyservice.conf | grep -q 'dstdomain vault'
          probe() { $dc exec -T worker python3 -c 'import socket, sys
          s = socket.create_connection(("egress", 3128), timeout=15)
          s.sendall(("CONNECT %s HTTP/1.1\r\nHost: %s\r\n\r\n" % (sys.argv[1], sys.argv[1])).encode())
          print(s.recv(200).split()[1].decode())' "$1"; }
          test "$(probe vault:8200)" = 200 && test "$(probe vault:8201)" = 403
          $dc exec -T worker bash /app/deploy/egress/selftest.sh egress:3128
      - name: Zero data loss is on in production and every commit waits for the standby (owner's decision 1)
        run: |
          dc="sudo docker compose --env-file deploy/.env"
          grep -q '^MASSLAK_ZERO_DATA_LOSS=on$' deploy/.env
          test "$($dc exec -T db psql -U postgres -Atc "SELECT sync_state FROM pg_stat_replication WHERE application_name = 'replica1'")" = sync
          test "$($dc exec -T db psql -U postgres -d masslak -Atc "SELECT value FROM sys.durability_metrics() WHERE metric = 'masslak_db_commits_wait_for_standby'")" = 1
          # a commit made while the standby is stopped waits for it, and goes through when it is back
          $dc stop db-replica
          if timeout 10 $dc exec -T db psql -U postgres -d masslak -qc "CREATE TABLE zz_durability_probe (x int)"; then
            echo "a commit went through with no standby to confirm it"; exit 1; fi
          $dc start db-replica
          for i in $(seq 30); do
            test "$($dc exec -T db psql -U postgres -Atc "SELECT count(*) FROM pg_stat_replication WHERE sync_state = 'sync'")" = 1 && break; sleep 2
          done
          curl -fsSk https://localhost/api/ready | grep -q '"ready":true'
      - name: Two-factor enrolment encrypts with keys the key service opens, and a new process opens them again
        run: |
          pw="$(sed -n 's/^Password: *//p' deploy/FIRST_LOGIN.txt)"
          h=(-H 'X-Masslak-Client: web' -H 'Content-Type: application/json')
          totp() { python3 -c 'import base64,hmac,struct,sys,time
          k = base64.b32decode(sys.argv[1] + "=" * (-len(sys.argv[1]) % 8)); c = int(time.time()) // 30
          d = hmac.new(k, struct.pack(">Q", c), "sha1").digest(); o = d[-1] & 15
          print("%06d" % ((struct.unpack(">I", d[o:o + 4])[0] & 0x7fffffff) % 1000000))' "$1"; }
          curl -fsSk -c jar "${h[@]}" -d "{\"identifier\":\"admin@install.test\",\"password\":\"$pw\",\"portal\":\"PLATFORM\"}" \
               https://localhost/api/auth/login | grep -q '"mfa":"ENROLL"'
          secret="$(curl -fsSk -b jar -c jar "${h[@]}" -X POST https://localhost/api/auth/mfa/enroll | python3 -c 'import json,sys; print(json.load(sys.stdin)["secret"])')"
          curl -fsSk -b jar -c jar "${h[@]}" -d "{\"code\":\"$(totp "$secret")\"}" https://localhost/api/auth/mfa/confirm | grep -q recovery_codes
          dc="sudo docker compose --env-file deploy/.env"
          test "$($dc exec -T db psql -U postgres -d masslak -Atc "SELECT count(*) FROM iam.mfa_factor WHERE secret_enc IS NOT NULL AND verified_at IS NOT NULL")" = 2
          # a new process opens the same keys through the key service: restart the API, sign in, and the stored secret checks the next code
          $dc restart app
          for i in $(seq 60); do curl -fsSk https://localhost/api/ready >/dev/null && break; sleep 2; done
          sleep 31                                    # the next 30-second step: a code is accepted once
          curl -fsSk -c jar2 "${h[@]}" -d "{\"identifier\":\"admin@install.test\",\"password\":\"$pw\",\"portal\":\"PLATFORM\"}" \
               https://localhost/api/auth/login | grep -q '"mfa":"VERIFY"'
          curl -fsSk -b jar2 -c jar2 "${h[@]}" -d "{\"code\":\"$(totp "$secret")\"}" https://localhost/api/auth/mfa/verify | grep -q '"ok":true'
          curl -fsSk -b jar2 "${h[@]}" https://localhost/api/auth/me | grep -q admin@install.test
      - name: A production server refuses demo data, plain message logs and the drift override (R-26, R-27, M-07)
        run: |
          dc="sudo docker compose --env-file deploy/.env"
          if $dc run --rm -T -e MASSLAK_SEED_DEMO=true migrate; then echo "demo data loaded on a production server"; exit 1; fi
          test "$($dc exec -T db psql -U postgres -d masslak -Atc "SELECT count(*) FROM iam.app_user WHERE email LIKE '%@masslak.test'")" = 0
          if $dc run --rm --no-deps -T -e MASSLAK_NOTIFY_SMS=log app python -c \
               "from app.modules.notify import providers; providers.require_in_production()"; then
            echo "the message log was accepted on a production server"; exit 1; fi
          set +e; $dc run --rm --no-deps -T -e MASSLAK_SCHEMA_DRIFT=warn migrate sh -c \
            'export PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD"; /app/db/upgrade.sh "$POSTGRES_DB"'; rc=$?; set -e
          test "$rc" = 5
      - name: An update without an off-site copy of its backup is refused; a complete one goes through (H-03)
        run: |
          sudo cp deploy/.env env.saved
          sudo sed -i 's|^MASSLAK_BACKUP_OFFSITE=.*|MASSLAK_BACKUP_OFFSITE=nowhere:masslak|' deploy/.env
          set +e; sudo ./deploy/update.sh 2> update.log; rc=$?; set -e
          cat update.log
          test "$rc" != 0 && grep -q 'not copied off the server' update.log
          curl -fsSk https://localhost/api/ready | grep -q '"ready":true'          # the running version kept serving
          sudo cp env.saved deploy/.env
          sudo ./deploy/update.sh
          curl -fsSk https://localhost/api/ready | grep -q '"ready":true'
      - name: An image the release did not sign is refused, and the running version keeps serving (H-08)
        run: |
          # the API's image changed after the release (one label added) and pushed under the same name, unsigned
          printf 'FROM %s\nLABEL tampered=true\n' "$(sed -n 's/^masslak=//p' IMAGES)" | sudo docker build -q -t 127.0.0.1:5000/masslak:tampered - > /dev/null
          sudo docker push -q 127.0.0.1:5000/masslak:tampered > /dev/null
          bad="$(sudo docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' 127.0.0.1:5000/masslak:tampered | grep -m1 '^127.0.0.1:5000/masslak@')"
          sed "s|^masslak=.*|masslak=$bad|" IMAGES > IMAGES.tampered
          set +e; sudo MASSLAK_IMAGES="$PWD/IMAGES.tampered" ./deploy/update.sh 2> refused.log; rc=$?; set -e
          cat refused.log
          test "$rc" != 0 && grep -q 'masslak .* is not signed by the key' refused.log
          curl -fsSk https://localhost/api/ready | grep -q '"ready":true'
          # the API still runs the signed image
          running="$(sudo docker image inspect -f '{{.Id}}' "masslak:$(sed -n 's/^MASSLAK_IMAGE_TAG=//p' deploy/.env)")"
          test "$running" = "$(sudo docker image inspect -f '{{.Id}}' "$(sed -n 's/^masslak=//p' IMAGES)")"
      - name: Alerts reach the receivers and every metric the alerts rest on is collected (H-07, addition 2)
        run: |
          dc="sudo docker compose --env-file deploy/.env"
          sudo ./deploy/monitoring/alert-drill.sh 120
          for i in $(seq 10); do $dc logs sink | grep -q '"uri":"/page"' && break; sleep 1; done
          $dc logs sink | grep -q '"uri":"/page"'                                   # the receiver itself got the page
          prom() { $dc exec -T prometheus wget -qO- "http://localhost:9090/api/v1/query?query=$1"; }
          for i in $(seq 40); do
            prom 'count(up==1)' | grep -q '"value":\[[0-9.]*,"5"\]' && break; sleep 5
          done
          prom 'up' | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; up={x["metric"]["job"]: x["value"][1] for x in r}; print(up); assert all(v == "1" for v in up.values()) and {"masslak-api","pgbouncer","node","alertmanager","prometheus"} <= set(up), up'
          sleep 45                                    # the rules are evaluated every 30 s
          prom 'ALERTS%7Balertname%3D%22MetricsMissing%22%7D' | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print([x["metric"].get("metric") for x in r]); assert r == [], r'
      - name: Logs on failure
        if: failure()
        run: sudo docker compose --env-file deploy/.env logs --tail 200

  security:
    name: Security and policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.11" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22" }
      - run: pip install bandit pip-audit ruff==0.15.20
      - name: Alert rules are valid and fire on their conditions (promtool, T3-16)
        run: |
          curl -sSLO https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz
          echo "60c126740c9cf1206b1e72150dd17914f1c3309bb7dc78a31d4670197ed4fa69  prometheus-2.53.2.linux-amd64.tar.gz" | sha256sum -c -
          tar xzf prometheus-2.53.2.linux-amd64.tar.gz
          prometheus-2.53.2.linux-amd64/promtool check rules deploy/monitoring/alerts.yml
          (cd deploy/monitoring && ../../prometheus-2.53.2.linux-amd64/promtool test rules alerts_test.yml)
      - name: Every image is pinned by digest and every action by commit (review stage C6)
        run: python scripts/pin_images.py
      - name: Language policy (English code, data and docs; Arabic only in locale files)
        run: python scripts/check_language.py
      - name: Lint the API and its tests (ruff)
        run: ruff check backend/app backend/tests
      - name: Static analysis of the API (bandit)
        run: bandit -q -c backend/pyproject.toml -r backend/app -ll
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit --require-hashes -r backend/requirements.lock   # every package of the image, transitive ones too
      - name: Known vulnerabilities in web dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -t masslak:ci .
      # what the image contains, package by package, kept with the run (review stage C6); releases carry a signed one.
      # Not attached to a release: CI may only read, and on a tag the release workflow publishes its own signed files.
      - name: Software bill of materials of the image (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: masslak:ci
          format: spdx-json
          output-file: masslak-image.spdx.json
          artifact-name: masslak-image.spdx.json
          upload-release-assets: false
