# Continuous integration: every push and pull request runs the schema tests, the API end-to-end tests against a
# real PostgreSQL with row-level security, the web build, the security scans and the language policy.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build a fresh database and run the checks
        run: db/tests/run.sh -h localhost -U postgres
      - name: Upgrading an existing database applies nothing twice
        run: |
          createdb -h localhost -U postgres upgrade_check
          db/build.sh upgrade_check -h localhost -U postgres > /dev/null
          db/upgrade.sh upgrade_check -h localhost -U postgres | tee upgrade.log
          ! grep -q '^>>' upgrade.log
      - name: An applied schema file that changed stops the upgrade before anything is applied (review stage A5)
        run: |
          echo '-- edited after release' >> db/schema/1056_payment_options.sql
          set +e; db/upgrade.sh upgrade_check -h localhost -U postgres 2> drift.log; rc=$?; set -e
          cat drift.log
          test "$rc" = 3 && grep -q '1056_payment_options.sql' drift.log
          MASSLAK_SCHEMA_DRIFT=warn db/upgrade.sh upgrade_check -h localhost -U postgres
          git checkout -- db/schema/1056_payment_options.sql
      - name: A record of applied files changed by hand stops the upgrade (release manifest, review stage C3)
        run: |
          psql -h localhost -U postgres -d upgrade_check -qc "DELETE FROM sys.schema_file WHERE file = '1056_payment_options.sql'"
          set +e; db/upgrade.sh upgrade_check -h localhost -U postgres 2> manifest.log; rc=$?; set -e
          cat manifest.log
          test "$rc" = 4 && grep -q 'release manifest' manifest.log
          test "$(psql -h localhost -U postgres -d upgrade_check -Atc "SELECT count(*) FROM sys.schema_file WHERE file = '1056_payment_options.sql'")" = 0
          psql -h localhost -U postgres -d upgrade_check -qc "INSERT INTO sys.schema_file (file, sha256) VALUES ('1056_payment_options.sql', '$(sha256sum db/schema/1056_payment_options.sql | cut -d' ' -f1)')"
          db/upgrade.sh upgrade_check -h localhost -U postgres
      - name: Data dictionary, ERD and README figures match the built database (review stage A8)
        run: python3 db/tools/gen_docs.py --check upgrade_check -h localhost -U postgres
      - name: No new two-way module dependency or table cycle without a recorded reason
        run: python3 db/tools/schema_dependencies.py upgrade_check -h localhost -U postgres

  api:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: masslak }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      MASSLAK_DATABASE_URL: postgresql://masslak_api:ci-api-password@localhost:5432/masslak
      MASSLAK_AUDIT_DATABASE_URL: postgresql://masslak_audit:ci-audit-password@localhost:5432/masslak
      MASSLAK_OWNER_URL: postgresql://postgres:postgres@localhost:5432/masslak
      MASSLAK_SANDBOX: "true"
      MASSLAK_COOKIE_SECURE: "false"
      MASSLAK_SIGNING_SECRET: ci-signing-secret-not-for-production-use
      MASSLAK_RATE_AUTH_PER_MINUTE: "600"
      # the whole suite runs from one address faster than any real client; production keeps the defaults (240 / 1200)
      MASSLAK_RATE_PUBLIC_PER_MINUTE: "20000"
      MASSLAK_RATE_API_PER_MINUTE: "20000"
      MASSLAK_TEST_URL: http://localhost:8077
      MASSLAK_METRICS_TOKEN: ci-metrics-token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Schema, login roles and demo data
        run: |
          db/build.sh masslak -h localhost -U postgres > /dev/null
          psql -h localhost -U postgres -d masslak -v ON_ERROR_STOP=1 -q -v api_password=ci-api-password \
               -v audit_password=ci-audit-password -f db/create_login_roles.sql
          python backend/scripts/seed_demo.py
          python backend/scripts/seed_modules.py
      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8077 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8077/api/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Unit and end-to-end tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: API log on failure
        if: failure()
        run: tail -200 api.log

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile apps
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Core unit tests (session, ticket credentials, offline boarding)
        run: npm test
      - name: Bundle both variants (Metro resolves every import)
        env: { CI: "1", EXPO_OFFLINE: "1" }
        run: |
          npx expo export --platform android --output-dir /tmp/passenger
          APP_VARIANT=driver npx expo export --clear --platform ios --output-dir /tmp/driver
          APP_VARIANT=operator npx expo export --clear --platform android --output-dir /tmp/operator
      - name: Known vulnerabilities in app dependencies
        run: npm audit --omit=dev --audit-level=critical

  stack:
    name: Deployment stack (compose, HTTPS, backup and restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: One-command installation (secrets, build, start, first administrator)
        run: |
          sudo ./deploy/install.sh --domain localhost --admin-email admin@install.test --demo --skip-server-setup
          sudo chown "$USER" deploy/.env deploy/FIRST_LOGIN.txt
          sed -i "s|^MASSLAK_BACKUP_DIR=.*|MASSLAK_BACKUP_DIR=$RUNNER_TEMP/backups|" deploy/.env
      - name: The first administrator signs in with the generated password
        run: |
          pw="$(sed -n 's/^Password: *//p' deploy/FIRST_LOGIN.txt)"
          test "$(stat -c %a deploy/FIRST_LOGIN.txt)" = 600
          curl -fsSk -H 'X-Masslak-Client: web' -H 'Content-Type: application/json' \
               -d "{\"identifier\":\"admin@install.test\",\"password\":\"$pw\",\"portal\":\"PLATFORM\"}" https://localhost/api/auth/login | grep -q '"mfa":"ENROLL"'
      - name: Site answers over HTTPS through Caddy
        run: |
          for i in $(seq 60); do curl -fsSk https://localhost/api/health && break; sleep 3; done
          curl -fsSk https://localhost/api/health
          curl -fsSk https://localhost/api/ready | grep -q '"ready":true'
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308       # plain HTTP redirects
          curl -sSkI https://localhost/ | grep -qi '^strict-transport-security'
      - name: Sign in and search (demo data)
        run: |
          curl -fsSk -c jar -H 'X-Masslak-Client: web' -H 'Content-Type: application/json' \
               -d '{"identifier":"passenger@masslak.test","password":"Masslak-Demo-2026","portal":"PASSENGER"}' https://localhost/api/auth/login
          curl -fsSk -b jar -H 'X-Masslak-Client: web' https://localhost/api/auth/me | grep -q passenger@masslak.test
          curl -fsSk "https://localhost/api/trips/search?origin=DAM&destination=ALP&on=$(TZ=Asia/Damascus date -d tomorrow +%F)" | grep -q '"trips"'
          curl -fsSk https://localhost/api/public/keys/ticket | grep -q public_key
      - name: Reports read the streaming replica (architecture review)
        run: |
          dc="docker compose --env-file deploy/.env"
          test "$($dc exec -T db-replica psql -U postgres -Atc 'SELECT pg_is_in_recovery()')" = t
          test "$($dc exec -T db psql -U postgres -Atc "SELECT count(*) FROM pg_stat_replication WHERE state = 'streaming'")" = 1
          $dc exec -T app printenv MASSLAK_REPORTS_DATABASE_URL | grep -q '@db-replica:'
      - name: The API and the worker reach the database through PgBouncer in transaction mode (capacity model)
        run: |
          dc="docker compose --env-file deploy/.env"
          $dc exec -T app printenv MASSLAK_DATABASE_URL | grep -q '@pgbouncer:6432/'
          $dc exec -T worker printenv MASSLAK_DATABASE_URL | grep -q '@pgbouncer:6432/'
          test "$($dc exec -T db psql -U postgres -Atc "SELECT count(*) FROM pg_stat_activity WHERE usename = 'masslak_api' AND client_addr IS NOT NULL")" -ge 1
      - name: Only Caddy is reachable from outside
        run: |
          for port in 5432 8000; do
            if timeout 3 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then echo "port $port is exposed"; exit 1; fi
          done
      - name: Egress (T3-02) - the worker has no route out, the proxy refuses internal and unlisted targets
        run: |
          dc="docker compose --env-file deploy/.env"
          if $dc exec -T worker python -c "import socket; socket.create_connection(('1.1.1.1', 443), 5)" 2>/dev/null; then
            echo "the worker reached the internet without the proxy"; exit 1; fi
          if $dc exec -T app python -c "import socket; socket.create_connection(('1.1.1.1', 443), 5)" 2>/dev/null; then
            echo "the API reached the internet without the proxy"; exit 1; fi
          $dc exec -T worker bash /app/deploy/egress/selftest.sh egress:3128
      - name: Backup, restore, and the site still works
        run: |
          ./deploy/backup.sh
          ./deploy/restore.sh "$(ls -d $RUNNER_TEMP/backups/*/ | tail -1)" --yes
          for i in $(seq 60); do curl -fsSk https://localhost/api/health && break; sleep 3; done
          curl -fsSk -H 'X-Masslak-Client: web' -H 'Content-Type: application/json' \
               -d '{"identifier":"passenger@masslak.test","password":"Masslak-Demo-2026","portal":"PASSENGER"}' https://localhost/api/auth/login
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env logs --tail 200

  security:
    name: Security and policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.11" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22" }
      - run: pip install bandit pip-audit ruff==0.15.20
      - name: Alert rules are valid and fire on their conditions (promtool, T3-16)
        run: |
          curl -sSLO https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz
          echo "60c126740c9cf1206b1e72150dd17914f1c3309bb7dc78a31d4670197ed4fa69  prometheus-2.53.2.linux-amd64.tar.gz" | sha256sum -c -
          tar xzf prometheus-2.53.2.linux-amd64.tar.gz
          prometheus-2.53.2.linux-amd64/promtool check rules deploy/monitoring/alerts.yml
          (cd deploy/monitoring && ../../prometheus-2.53.2.linux-amd64/promtool test rules alerts_test.yml)
      - name: Every image is pinned by digest and every action by commit (review stage C6)
        run: python scripts/pin_images.py
      - name: Language policy (English code, data and docs; Arabic only in locale files)
        run: python scripts/check_language.py
      - name: Lint the API and its tests (ruff)
        run: ruff check backend/app backend/tests
      - name: Static analysis of the API (bandit)
        run: bandit -q -c backend/pyproject.toml -r backend/app -ll
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Known vulnerabilities in web dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -t masslak:ci .
      # what the image contains, package by package, kept with the run (review stage C6); releases carry a signed one
      - name: Software bill of materials of the image (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: masslak:ci
          format: spdx-json
          output-file: masslak-image.spdx.json
          artifact-name: masslak-image.spdx.json
