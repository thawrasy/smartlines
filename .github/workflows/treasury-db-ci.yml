name: treasury-database-ci

# BankFas treasury platform (treasury-platform/): runs tools/ci/db_ci.sh on every change to the database model,
# the generator, the database scripts, or the deployment scripts it runs (tools/deploy), then tools/ci/app_ci.sh,
# which builds and tests the application against the database just deployed. SQL Server 2025 runs as a
# service container on the job.
# GitHub reads workflows only from the repository root, so this file lives here and works in treasury-platform/.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'treasury-platform/db/**'
      - 'treasury-platform/tools/dbgen/**'
      - 'treasury-platform/tools/ci/**'
      - 'treasury-platform/tools/deploy/**'
      - 'treasury-platform/versions.json'
      # the permission seed is generated from the readiness documents and the specs' role matrices (step 2)
      - 'treasury-platform/docs/30-readiness/**'
      - 'treasury-platform/docs/10-detailed-analysis/**'
      # the generated tables of the credit methodology document match tools/dbgen/credit_scorecard.json (step 2)
      - 'treasury-platform/docs/35-credit-assessment-methodology.md'
      # the application (phase 2, ADR 0040), whose integration tests run against the deployed database
      - 'treasury-platform/app/**'
      # the release images and the host templates (the images job)
      - 'treasury-platform/tools/host/**'
      - 'treasury-platform/.dockerignore'
      - 'treasury-platform/RELEASE'
      - 'treasury-platform/tools/release/**'
      - 'treasury-platform/docs/57-release.md'
      - 'treasury-platform/docs/57-RELEASE.docx'
      - '.github/workflows/treasury-db-ci.yml'
  pull_request:
    paths:
      - 'treasury-platform/db/**'
      - 'treasury-platform/tools/dbgen/**'
      - 'treasury-platform/tools/ci/**'
      - 'treasury-platform/tools/deploy/**'
      - 'treasury-platform/versions.json'
      # the permission seed is generated from the readiness documents and the specs' role matrices (step 2)
      - 'treasury-platform/docs/30-readiness/**'
      - 'treasury-platform/docs/10-detailed-analysis/**'
      # the generated tables of the credit methodology document match tools/dbgen/credit_scorecard.json (step 2)
      - 'treasury-platform/docs/35-credit-assessment-methodology.md'
      # the application (phase 2, ADR 0040), whose integration tests run against the deployed database
      - 'treasury-platform/app/**'
      # the release images and the host templates (the images job)
      - 'treasury-platform/tools/host/**'
      - 'treasury-platform/.dockerignore'
      - 'treasury-platform/RELEASE'
      - 'treasury-platform/tools/release/**'
      - 'treasury-platform/docs/57-release.md'
      - 'treasury-platform/docs/57-RELEASE.docx'
      - '.github/workflows/treasury-db-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: treasury-platform

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      sqlserver:
        # The SQL Server build of the release register treasury-platform/versions.json, on Ubuntu 24.04 like the
        # production VPS (ADR 0001, DQ-B01-2). db_ci.sh step 3 fails when the two differ, and the deployment preflight
        # (gate G4, ADR 0014) refuses a server of another build. The digest fixes the image itself, not only its tag
        # (self-review E13); step 3 compares it with versions.json too.
        image: mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04@sha256:742481d1b1186cccc81220a1eaacef244ca8d0f7d19c8e5c70df8ae541ffbab2
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          # Throwaway password for an ephemeral container that only this job can reach.
          MSSQL_SA_PASSWORD: 'CiOnly-Ephemeral-Passw0rd!'
        ports:
          - 1433:1433
    env:
      SA_PASSWORD: 'CiOnly-Ephemeral-Passw0rd!'
      SQL_SERVER: 'localhost,1433'
    # The actions are pinned to their commits (actions/checkout v4.4.0, actions/setup-python v5.6.0,
    # actions/setup-dotnet v5.4.0, actions/setup-node v4.4.0): a moved tag
    # cannot change what runs here (self-review E13).
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # check_fk_indexes.py reads the ERD layout module, which imports Pillow.
      - name: Install Python packages
        run: python -m pip install --quiet 'pillow==12.3.0'

      - name: Make sure sqlcmd is installed
        run: |
          if command -v sqlcmd >/dev/null 2>&1; then
            sqlcmd -? | head -1
            exit 0
          fi
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Database checks and deployment
        run: bash tools/ci/db_ci.sh

      - name: Set up .NET (the SDK of treasury-platform/app/global.json)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: treasury-platform/app/global.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'

      - name: Application build, unit tests and integration tests
        run: bash tools/ci/app_ci.sh

  # The release images (app/deploy/Dockerfile, ADR 0053), built as a host builds them, with Playwright's Chromium
  # downloaded (the path the sandbox of the pilot run could not reach), then the pilot run of docs/53: the browser
  # test against the two containers, read-only, no capabilities, user 10001, file master keys, each process with its
  # own database logins (tools/ci/image_pilot.sh), on a fresh database deployed the way production does.
  images:
    # A release is published only after the database job (the database tests and app_ci.sh, the integration tests
    # among them) has passed on the same commit.
    needs: database
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # contents: write for the release step only, which runs on a pushed commit whose message says [release] (docs/57).
    permissions:
      contents: write
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04@sha256:742481d1b1186cccc81220a1eaacef244ca8d0f7d19c8e5c70df8ae541ffbab2
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          # Throwaway password for an ephemeral container that only this job can reach.
          MSSQL_SA_PASSWORD: 'CiOnly-Ephemeral-Passw0rd!'
        ports:
          - 1433:1433
    env:
      SA_PASSWORD: 'CiOnly-Ephemeral-Passw0rd!'
      SQL_SERVER: 'localhost,1433'
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Make sure sqlcmd is installed
        run: |
          if command -v sqlcmd >/dev/null 2>&1; then
            sqlcmd -? | head -1
            exit 0
          fi
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Build the API and worker images
        run: |
          docker build -f app/deploy/Dockerfile --target api -t bankfas-api:ci .
          docker build -f app/deploy/Dockerfile --target worker -t bankfas-worker:ci .
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep bankfas

      - name: Check the host templates
        run: |
          sed -e 's#<REGISTRY>/bankfas-api:<VERSION>#bankfas-api:ci#; s#<REGISTRY>/bankfas-worker:<VERSION>#bankfas-worker:ci#; s#<CLAMAV_VERSION>#stable#' \
              -e "s#/opt/bankfas/api.env#$PWD/tools/host/api.env.example#; s#/opt/bankfas/worker.env#$PWD/tools/host/worker.env.example#" \
              tools/host/compose.yml > "$RUNNER_TEMP/compose.yml"
          docker compose -f "$RUNNER_TEMP/compose.yml" config --quiet
          bash -n tools/host/*.sh tools/deploy/*.sh tools/ci/*.sh tools/release/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'

      - name: The browser test's own Chromium
        run: cd app/web && npm ci --no-audit --no-fund --loglevel=error && npx playwright install --with-deps chromium

      - name: A fresh database, deployed the way production does
        run: bash tools/ci/fresh_deploy.sh

      - name: The pilot run against the containers
        run: sudo -E env "PATH=$PATH" API_IMAGE=bankfas-api:ci WORKER_IMAGE=bankfas-worker:ci HOME="$HOME" bash tools/ci/image_pilot.sh

      # The release package (docs/57): made from the images the pilot run just passed, and published as a pre-release
      # named after treasury-platform/RELEASE. A version already released is never replaced.
      - name: The release package
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="$(cat RELEASE)"
          if gh release view "bankfas-v$V" >/dev/null 2>&1; then echo "bankfas-v$V is already released; raise RELEASE" >&2; exit 1; fi
          bash tools/release/make_release.sh "$V" bankfas-api:ci bankfas-worker:ci "$RUNNER_TEMP/release"
          gh release create "bankfas-v$V" "$RUNNER_TEMP"/release/* --target "$GITHUB_SHA" --prerelease \
            --title "BankFas $V (pilot)" --notes "The pilot release $V. Install: INSTALL-AR.md (docs/57). Check the files first: sha256sum -c SHA256SUMS."
